<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#21463d">
<title>点菜模拟器 · 万家酒楼</title>
<style>
:root{--paper:#f6efe2;--pink:#f4dfd8;--red:#963c31;--line:#b98777;--green:#21463d;--ink:#322f29;--blue:#23438e;--pen:#c62828;--muted:#695d50;--serif:"STSong","Songti SC","SimSun",serif;--hand:"KaiTi","STKaiti","FangSong",serif;--mono:"Courier New",monospace}
*{box-sizing:border-box}
body{margin:0;height:100vh;height:100dvh;display:grid;place-items:center;overflow:hidden;color:var(--ink);font:16px/1.5 system-ui,"Microsoft YaHei",sans-serif;background:radial-gradient(ellipse at 48% 36%,#5a51412c 0%,#171a17a6 100%),repeating-linear-gradient(2deg,transparent 0 118px,#191b18b3 119px,#55504473 120px,transparent 123px 188px),repeating-linear-gradient(1deg,#39372e 0,#34342d 2px,#39382f 4px,#403d33 6px,#35352e 9px)}
body::before{content:"";position:fixed;left:11%;bottom:12%;width:125px;aspect-ratio:1;border:4px solid #bd955c10;border-left-color:#c09a6424;border-radius:49% 52% 46% 50%;box-shadow:0 0 0 2px #1b20192c,inset 2px 1px 4px #181c1938;transform:rotate(23deg)}
body::after{content:"";position:fixed;z-index:-0;pointer-events:none;right:6%;top:-135px;width:7px;height:370px;border-radius:50% 50% 30% 30%;background:linear-gradient(90deg,#221911,#7e6242 42%,#35271b);transform:rotate(-34deg);box-shadow:15px 0 0 #4a3827,18px 6px 9px #181814,3px 5px 8px #151610}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.42;cursor:default}
button:focus-visible,[tabindex="-1"]:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.pad{position:relative;z-index:1;width:min(414px,100vw);height:min(860px,calc(100dvh - 24px));border-radius:9px 9px 6px 6px;overflow:hidden;display:flex;flex-direction:column;background-color:var(--paper);background-image:repeating-linear-gradient(7deg,#66513506 0 1px,transparent 1px 4px),radial-gradient(ellipse at 15% 12%,#fff8,transparent 65%);box-shadow:0 2px #dcc5b6,0 4px #b59080,0 6px #dbc5a8,0 8px #79695b,0 21px 52px #080b08a6}
.pad.back{background-color:var(--pink)}
.binding{height:22px;flex:none;border-bottom:1px dashed #98705a90;background:radial-gradient(ellipse at center,#37392f 0 2.6px,#ac927c 3px,transparent 3.8px) 2px 1px/23px 17px repeat-x,linear-gradient(#dacbb4,#f0e3cd)}
.brand{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:3px 10px;margin:0 23px;padding:9px 0 6px;border-bottom:3px double var(--red);color:var(--red)}
.brand strong{font:900 19px var(--serif);letter-spacing:.1em}.brand strong i{font:700 15px var(--serif);border:1px solid;border-radius:50%;display:inline-grid;place-items:center;width:23px;height:23px;margin-right:7px;letter-spacing:0}
.smallbtn,.tab,.ctrl{background:transparent;border:1px solid var(--line);border-radius:2px;font-weight:600}.smallbtn{font-size:13px;padding:4px 9px;color:var(--red)}
#page{flex:1;min-height:0;display:flex;flex-direction:column}
.body{overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#ac978277 transparent;flex:1;min-height:0;padding:17px 23px 15px}
.foot{flex:none;padding:10px 23px 14px;border-top:1px dashed var(--line)}
.ticket{display:flex;align-items:center;justify-content:space-between;gap:8px;font:600 12px var(--mono),var(--serif);letter-spacing:.09em;color:var(--red)}
.ticket b{font-weight:normal;letter-spacing:.04em}
h1,h2,h3,p{margin:0}h1,h2,h3{font-family:var(--serif)}h2{font-size:28px;line-height:1.23;color:var(--green)}h3{font-size:18px}
.pad{perspective:1500px}
.book-cover{
  position:absolute;inset:0;z-index:4;overflow:auto;overscroll-behavior:contain;
  padding:14px 13px 14px 23px;border-radius:inherit;transform-origin:left center;
  background-color:#efe4ce;
  background-image:linear-gradient(90deg,#94775a80,#e4d0b0 5px,#efdfc3 10px,#9c79574d 13px,#fff3dcb3 15px,transparent 19px),
    repeating-linear-gradient(13deg,transparent 0 3px,#78563708 3px 4px),
    radial-gradient(ellipse at 65% 22%,#fff6e280,transparent 65%);
  box-shadow:inset -2px 0 0 #ab9270,inset 0 -2px 1px #a78a6766;
  transition:transform 0.68s cubic-bezier(0.22, 0.85, 0.32, 1), opacity 0.55s ease 0.12s;
}
.book-cover[hidden],.cover-bookmark[hidden]{display:none}
.book-cover::before{content:"";position:absolute;inset:0 auto 0 0;width:18px;z-index:1;pointer-events:none;transition:box-shadow .45s ease}
.book-cover.opening{transform:rotateY(-172deg) translateZ(4px);opacity:0;pointer-events:none}
.book-cover.opening::before{box-shadow:inset 12px 0 14px #4c301ed9,5px 0 12px #4c301e73}
.cover-board{
  min-height:100%;border:4px double #963c31;padding:clamp(15px,3.5vh,29px) clamp(13px,4.2vw,22px);
  display:grid;grid-template-rows:auto 1fr auto;gap:12px;
}
.cover-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.cover-plaque{flex:none;padding:3px 8px;border:3px double var(--red);color:var(--red);font:700 14px/1.3 var(--serif);letter-spacing:.13em}
.cover-bookmark{
  position:relative;width:clamp(118px,38vw,147px);padding:9px 9px 8px;margin:-10px -6px 0 0;
  border:1px solid #b5a17c;background:#f5e7bd;color:var(--blue);transform:rotate(3deg);
  box-shadow:1px 2px 2px #59452a26;font:600 12px/1.45 var(--hand);overflow-wrap:anywhere;
}
.cover-bookmark::before{content:"";position:absolute;right:9px;top:-6px;width:5px;height:12px;border:1px solid #776f5e;border-radius:5px}
.cover-titleblock{display:flex;flex-direction:column;justify-content:center;align-items:center;padding-block:clamp(10px,4vh,36px);text-align:center}
.cover-title{color:var(--green);line-height:1.12}
.cover-title span,.cover-title strong{display:block}
.cover-title span{font:700 clamp(23px,7.6vw,32px)/1.2 var(--serif);letter-spacing:.15em;text-indent:.15em}
.cover-title strong{margin-top:7px;font:900 clamp(36px,11.8vw,49px)/1.25 var(--serif);letter-spacing:.035em;text-shadow:.5px 0 currentColor}
.cover-title::after{content:"";display:block;width:31px;height:1px;background:var(--red);margin:15px auto 0}
.cover-chop{
  display:grid;grid-template-columns:repeat(2,1em);margin-top:clamp(17px,4vh,36px);padding:5px;
  border:4px double currentColor;border-radius:6px 4px 7px 4px;color:var(--red);transform:rotate(-8deg);
  font:900 22px/1 var(--serif);text-shadow:.4px 0 currentColor;
}
.cover-bottom{display:grid;gap:9px;align-content:end}
.primary.cover-open{min-height:48px;border-radius:2px;box-shadow:inset 0 0 0 3px var(--red),inset 0 0 0 4px #ebc7aa80,0 2px #d6b999,0 4px #713b2d,0 5px 9px #5c452530}
@media(max-height:520px){.cover-board{gap:6px;padding-block:10px}.cover-titleblock{padding-block:6px}.cover-title::after{margin-top:6px}.cover-chop{margin-top:9px;font-size:16px}.cover-bottom{gap:4px}}
@media(max-height:420px) and (orientation:landscape){
  .cover-titleblock{flex-direction:row;gap:18px}.cover-title span{font-size:20px}.cover-title strong{font-size:34px}
  .cover-title::after{display:none}.cover-chop{margin:0}
}
.meta{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);border-left:1px solid var(--line);color:var(--red)}
.meta div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px 9px;font:13px/1.55 var(--serif);white-space:nowrap}
.pen,.meta b,.price,.seq{color:var(--blue);font-family:var(--hand);font-weight:bold}.meta b{display:inline-block;transform:rotate(-1.5deg);font-size:16px;margin-left:8px}
.subtitle{display:flex;align-items:center;justify-content:space-between;color:var(--red);border-bottom:1px solid var(--line);padding-bottom:5px}
.tiny{font-size:12px;color:var(--muted)}
.seq{font:700 16px/24px var(--hand);width:25px;height:25px;text-align:center;border:1px solid var(--blue);border-radius:48% 54% 46% 52%;color:var(--blue);transform:rotate(-5deg)}
.primary{display:flex;justify-content:center;align-items:center;gap:10px;width:100%;min-height:46px;padding:9px 8px;border:1px solid #7d332a;border-radius:3px;background:#963c31;color:#fff7e8;box-shadow:inset 0 0 0 3px #963c31,inset 0 0 0 4px #dca79370,0 2px 0 #6e392b;font:700 17px/1.4 var(--serif);letter-spacing:.055em}
.primary:active:not(:disabled){transform:translateY(1px);box-shadow:none}.primary .cut{font-size:24px;line-height:.9}
.imprint{display:flex;justify-content:space-between;align-items:center;margin-top:10px;color:var(--muted);font:12px var(--serif);letter-spacing:.07em}.inks{color:var(--red);margin-right:4px;text-shadow:6px 0 var(--blue)}
.ledger-counter{text-align:center;color:#6e5d4f;font:11.5px/2 var(--serif)}
.ledger-counter>span{border-bottom:1px dashed #963c3133;white-space:nowrap}
.ledger-counter b{color:#23438e;font-family:var(--mono);font-weight:700}
.stagehead{margin-bottom:15px}.stagehead h2{margin-top:9px}.stagehead p{color:var(--muted);font-size:14px;margin-top:6px}
.menu-head{margin-bottom:0}.menu-title{display:flex;align-items:baseline;justify-content:space-between;gap:9px;margin-top:6px}
.menu-title h2{margin:0}.menu-title span{color:var(--muted);font:12px/1.4 var(--serif);white-space:nowrap}
.info{padding:14px 0;border-bottom:1px dotted #aa9181}.info h3{color:var(--red);font-size:15px;margin-bottom:5px}.info p{font-size:15px}
.brief-panel{margin-top:12px;border-block:1px solid rgba(150,60,49,.2)}
.brief-toggle{display:flex;align-items:center;width:100%;min-height:38px;padding:5px 0;border:0;background:transparent;text-align:left;color:var(--red);font:700 14px/1.4 var(--serif)}
.brief-toggle .brief-context{min-width:0;margin-left:10px;color:var(--muted);font:12px/1.5 var(--serif)}
.brief-toggle::after{content:"";flex:none;width:6px;height:6px;margin:0 5px 3px auto;border:solid currentColor;border-width:0 1.5px 1.5px 0;transform:rotate(45deg)}
.brief-toggle[aria-expanded="true"]::after{transform:rotate(225deg);margin-bottom:-3px}
.brief-panel .info{padding:8px 0;border-bottom:0}.brief-panel .info:first-child{padding-top:2px}.brief-panel .info:last-child{padding-bottom:12px}
.brief-panel .info h3{font-size:13px}.brief-panel .info p{line-height:1.55}
.summary{display:flex;align-items:center;justify-content:space-between;gap:5px;font-size:13px;margin-bottom:8px}.summary b{font:700 18px var(--hand);color:var(--blue)}.over,.summary.over b{color:var(--pen)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:10px 0 2px}.tab{padding:6px 0;font-size:13px;color:var(--red)}.tab.active{background:var(--green);color:var(--paper);border-color:var(--green)}
.order-strip{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:5px 12px;margin-bottom:9px}
.order-link{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:5px 10px;border:1px solid #23438e80;border-radius:2px;background:#23438e09;color:var(--blue);font:700 16px/1.25 var(--serif)}
.order-link .order-count{font:700 13px/1.3 var(--hand);white-space:nowrap}.order-link::after{content:"";width:6px;height:6px;border:solid currentColor;border-width:1.5px 1.5px 0 0;transform:rotate(45deg)}
.order-link.return::after{order:-1;transform:rotate(-135deg)}
.order-cost{margin-left:auto;text-align:right;font-size:13px;line-height:1.35}.order-cost b{color:var(--blue);font:700 17px var(--hand)}.order-cost.over b{color:inherit}.order-cost small{display:block;color:var(--muted);font-size:12px}
.queue{padding:10px 0;border-bottom:1px dotted #b39682;display:flex;align-items:center;gap:7px}.detail{flex:1;min-width:0}.name{font:700 17px var(--serif)}.desc{font-size:13px;color:var(--muted)}.price{font:700 15px var(--mono)}.ctrl{border-color:#637797;color:var(--blue);min-width:32px;height:33px;padding:0 6px}
.dish{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:8px;align-items:center;padding:12px 0;border-bottom:1px solid rgba(150,60,49,.2)}
.dish-info{min-width:0;display:flex;align-items:center;gap:10px;padding:0;border:0;background:none;text-align:left}
.dish-info .name,.dish-info .spec{display:block}.dish-info .name{line-height:1.35}.dish-info .spec{margin-top:3px;color:#7a6b5d;font:11px/1.45 var(--serif)}
.dish-sale{display:flex;align-items:center;justify-content:flex-end;gap:5px}.dish-sale .price{white-space:nowrap}
.dish-check{display:grid;place-items:center;min-width:38px;min-height:42px;padding:0;border:0;background:none;color:var(--blue)}
.dish-check span{display:grid;place-content:center;width:21px;height:21px;border:1px solid #23438e91;border-radius:2px 1px 3px 1px;font:700 24px/1 var(--hand)}
.dish-check[aria-pressed="true"] span{border-color:var(--blue);transform:rotate(-4deg)}
.dish-desc{grid-column:1/-1;max-height:0;overflow:hidden;margin-left:56px;color:var(--muted);font:13px/1.6 var(--serif);opacity:0;transition:max-height .24s ease,opacity .18s ease}
.dish-desc span{display:block;padding-top:6px}.dish.open-detail .dish-desc{max-height:12em;opacity:1}
@keyframes dish-unfold{from{max-height:0;opacity:0}to{max-height:12em;opacity:1}}
@media(prefers-reduced-motion:no-preference){.dish.just-checked .dish-desc{animation:dish-unfold .24s ease}}
.orderbtns{grid-column:1/-1;justify-self:end;display:flex;align-items:center;gap:3px;margin-top:5px;color:var(--blue)}
.orderbtns .ctrl{height:32px;min-width:32px;border-color:#23438e55}.qty{min-width:30px;text-align:center;font:700 14px/1.3 var(--hand)}
.queue-list{position:relative;overflow-anchor:none}
.queue{position:relative;gap:6px}.queue .seq{flex:none}.queue .ctrl{width:28px;min-width:28px;height:38px;padding:0}
.queue .course{display:block;color:var(--blue);font:600 13px/1.4 var(--hand)}
.queue-grip{flex:0 0 36px;height:44px;padding:0;border:1px dashed #23438e77;border-radius:2px;background:#23438e07;color:var(--blue);font:700 23px var(--serif);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.queue-grip:disabled{cursor:default}.queue.lifted{z-index:1;background:var(--paper);box-shadow:0 3px 9px #492f2240;transform:translateY(var(--slide,0px)) scale(1.02)}.queue.lifted .queue-grip{cursor:grabbing}
.sketch{position:relative;flex:none;width:46px;height:46px;overflow:hidden;border:1px solid #23438e66;border-radius:2px;color:#23438e}
.sketch svg,.sketch img{width:100%;height:100%;display:block}.sketch img{position:absolute;inset:0;object-fit:cover;background:var(--paper)}
.sketch svg{fill:none;stroke:#23438e;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}.sketch .hatch{stroke:#23438e55;stroke-width:1.2}.sketch .steam{stroke-width:1.15}
.cross{position:relative}.cross::after{content:"";position:absolute;left:0;top:37%;width:100%;height:3px;border-block:1px solid var(--blue);transform:rotate(-2deg);transform-origin:left;animation:stroke .19s ease-out}.empty{color:var(--muted);font-size:14px;padding:24px 0}
.sliptop{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.sliptop b{color:var(--red);font-family:var(--serif)}
.report{border-top:3px double var(--red);margin-top:13px;padding-top:10px}.score{color:var(--pen);font:italic 700 51px/1 var(--hand)}.score small{font-size:18px}.bars{margin:12px 0}.bar{display:grid;grid-template-columns:72px 1fr 26px;align-items:center;gap:8px;font-size:13px;margin:6px 0}.track{background:#b985712a;height:7px}.track i{display:block;height:100%;background:var(--blue)}.bar b{color:var(--blue);text-align:right}
.notes{padding-left:23px;color:var(--pen);font:600 16px/1.65 var(--hand)}.notes li{padding:6px 0;border-bottom:1px dotted #bc998b}.notes strong{border:1px solid;border-radius:49%;padding:1px 4px}.notes u{text-underline-offset:3px}
.grade-title{display:grid;grid-template-columns:minmax(0,1fr) clamp(112px,31vw,128px);gap:10px;align-items:center;margin:12px 5px 0 0}
.grade-title h2{margin:0;font-size:clamp(20px,6.4vw,27px);text-wrap:balance}
.seal{position:relative;display:grid;align-content:center;justify-items:center;min-height:80px;border:3px solid currentColor;border-radius:50%;color:#a42b23;transform:rotate(-7deg);font-family:var(--serif);line-height:1.13;white-space:nowrap}
.seal::before{content:"";position:absolute;inset:3px;border:1px solid currentColor;border-radius:inherit;pointer-events:none}
.seal small{font:700 10px/1.1 var(--serif);letter-spacing:.11em}
.seal small::before,.seal small::after{content:"·";margin:0 3px}
.seal b{display:block;max-width:100%;padding:0 5px;margin:4px 0 0;font:900 clamp(16px,4.6vw,19px)/1.1 var(--serif);white-space:normal;text-align:center;text-wrap:balance}
.seal::after{content:"";position:absolute;inset:-2px;border-radius:inherit;pointer-events:none;background:repeating-linear-gradient(112deg,transparent 0 13px,#f9ebe89c 13.5px,transparent 14.3px 24px)}
.grade-title :is(.seal,.award-seal){transform:scale(1) rotate(-6deg)}
.awaiting-imprint .grade-title :is(.seal,.award-seal){opacity:0}
dialog{color:var(--ink);width:min(345px,92vw);max-height:80dvh;padding:21px;background:var(--paper);border:2px solid var(--red);border-radius:4px;box-shadow:0 12px 40px #16181266}dialog::backdrop{background:#171813a8}dialog h2{font-size:23px}dialog p{margin:10px 0;font-size:15px}dialog .primary{margin-top:14px}
#achModal{width:min(430px,94vw);padding:0;overflow:hidden}
#achModal[open]{display:flex;flex-direction:column}
.archive-head{display:flex;flex:none;align-items:center;justify-content:space-between;gap:9px;margin:0 14px;padding:10px 0;border-bottom:3px double var(--red)}
.archive-head .smallbtn{min-height:38px}.archive-head h2{font-size:22px}
.archive-pages{min-height:0;overflow:auto;overscroll-behavior:contain;padding:0 14px 14px}
.archive-count{color:var(--blue);font:700 14px var(--hand)}
.archive-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:0;padding:0;list-style:none}
.archive-row{min-width:0;padding:11px 9px 9px;border:1px dotted #988b7a;background:#eee8dd55}

.archive-stamp{display:inline-block;max-width:100%;padding:2px 5px;color:#766f65;border:1px dashed #968d80;border-radius:2px;font:700 16px/1.35 var(--serif)}
.archive-stamp.locked{width:29px;text-align:center}
.archive-row.earned{border-color:#23438e77;background:#23438e05}
.earned .archive-stamp{border:3px double currentColor;color:var(--blue);transform:rotate(-2deg);font-size:15px}
.archive-row.earned p{color:var(--red);font:600 14px/1.55 var(--hand)}
.share-btn{border:1px solid #23438e88;border-radius:2px;background:#23438e08;color:var(--blue);font:700 15px/1.35 var(--hand);padding:5px 9px}
.report-actions{display:flex;align-items:center;justify-content:flex-end;gap:6px}
.subtitle:has(.report-actions){flex-wrap:wrap;gap:4px 6px}
.copy-field{position:fixed;inset:0 auto auto 0;width:1px;height:1px;opacity:0;font-size:16px}
.copy-field.manual{position:static;display:block;width:100%;height:7em;margin:8px 0;opacity:1;padding:8px;color:var(--blue);background:var(--paper);border:1px solid var(--line)}
#shareModal{width:min(424px,94vw);max-height:min(91dvh,760px);padding:0;border:4px double var(--red);border-radius:2px;background:repeating-linear-gradient(7deg,#66513506 0 1px,transparent 1px 4px),var(--paper);overflow:hidden}
#shareModal[open]{display:flex;flex-direction:column}
.share-head{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 16px;padding:8px 0;border-bottom:3px double var(--red)}
.share-head h2{color:var(--red);font:900 clamp(17px,5vw,22px)/1.23 var(--serif)}.share-head .smallbtn{flex:none;min-height:38px}
.share-body{min-height:0;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;padding:12px 16px 16px}

.share-result p{margin:0}.share-level{color:var(--green);font:700 16px/1.35 var(--serif)}.share-scene{margin-top:4px!important;color:var(--muted);font-size:13px}
.share-result .share-score{margin:6px 0 0;color:var(--red);font:italic 700 44px/1 var(--hand)}.share-score small{font-size:16px}
.share-rank{justify-self:stretch;min-height:85px;white-space:normal;text-align:center;padding:10px 8px}.share-rank b{font-size:clamp(17px,4.9vw,20px);text-wrap:balance}

function buildStoreMenu(scenario,allDishes){
  // 同一张派单使用同一颗种子，翻页、核单和评分都能拿回原来的水单。
  let seed=(scenario.menuSeed??Number(scenario.id?.slice(-2)))>>>0;
  function random(){
    seed=(Math.imul(1664525,seed)+1013904223)>>>0;
    return seed/4294967296;
  }
  const deck=allDishes.slice();
  for(let i=deck.length-1;i>0;i--){
    const j=Math.floor(random()*(i+1));
    [deck[i],deck[j]]=[deck[j],deck[i]];
  }
  const {region,guestTraits:guests,tier,budgetMax,headcount}=scenario;
  const local=d=>d.regions.includes(region);
  const signature=d=>d.tags.includes("local_signature");
  const foreign=d=>signature(d)&&!local(d);
  const fiddly=d=>d.tags.includes("needs_peeling")||d.tags.includes("bony_messy");
  const risky=d=>foreign(d)||fiddly(d)||d.tags.includes("premade_suspect")||d.tags.includes("showy_empty");
  const selection=new Set(deck.filter(d=>signature(d)&&local(d)));

  // 招牌里的壳、骨也占雷区名额。一道外地招牌供辨认，其余从本地有售的菜里挑。
  const bait=deck.filter(d=>(foreign(d)||local(d))&&risky(d));
  const traps=new Set([...selection].filter(risky));
  const trapQuota=5+Math.floor(random()*2);
  function takeTraps(predicate,count){
    for(const dish of bait){
      if(count<=0||traps.size>=trapQuota)break;
      if(!traps.has(dish)&&predicate(dish)){traps.add(dish);count--}
    }
  }
  takeTraps(foreign,1);
  const special=Math.floor(random()*3);
  if(special===0&&tier!=="street")takeTraps(d=>local(d)&&d.tags.includes("premade_suspect"),3);
  if(special===1)takeTraps(d=>local(d)&&d.tags.includes("showy_empty"),2);
  if(special===2&&(guests.hasElderOrLeader||guests.hasFemaleWatchingDiet))takeTraps(d=>local(d)&&fiddly(d),3);
  takeTraps(local,trapQuota);
  for(const dish of traps)selection.add(dish);

  const basics=deck.filter(d=>local(d)&&!risky(d));
  // 偏好排序之前已经洗牌：同样合适的菜每次轮换，不把某一道固定排在分类首位。
  function penalty(d){
    const seafood=d.tags.includes("seafood")||d.category==="海鲜水产"||["fish","shrimp_crab"].includes(d.ingredientType);
    let points=0;
    if((guests.avoidSeafood&&seafood)||(guests.avoidSpicy&&d.spicy>0))points+=8;
    if(tier!=="street"&&(d.tags.includes("cold_dish")||d.tags.includes("street_heavy")))points+=3;
    if(tier==="street"&&d.price>budgetMax/3)points+=3;
    return points;
  }
  basics.sort((a,b)=>penalty(a)-penalty(b));
  function takeBasics(predicate,count){
    for(const dish of basics){
      if(count<=0)break;
      if(!selection.has(dish)&&predicate(dish)){selection.add(dish);count--}
    }
  }
  takeBasics(d=>d.id==="dish_50",1);
  for(const category of new Set(allDishes.map(d=>d.category))){
    if(![...selection].some(d=>d.category===category))takeBasics(d=>d.category===category,1);
  }
  if(guests.hasElderOrLeader)takeBasics(d=>d.tags.includes("elder_friendly")&&penalty(d)===0,2);
  if(guests.hasFemaleWatchingDiet)takeBasics(d=>d.tags.includes("low_fat")&&penalty(d)===0,2);
  if(budgetMax/headcount>=100)takeBasics(d=>d.price>=150&&["beef","pork","poultry","soup"].includes(d.ingredientType)&&penalty(d)===0,guests.avoidSeafood?4:2);
  const target=32+Math.floor(random()*5);
  takeBasics(()=>true,target-selection.size);
  return deck.filter(d=>selection.has(d));
}

function passScore(level){return Math.min(92,60+(level-1)*5)}
const percentileBands=[[0,39,1,17],[40,59,18,41],[60,69,42,61],[70,79,62,77],
  [80,89,78,90],[90,95,91,95],[96,99,96,98]];
function estimatePercentile(score){
  if(score>=100)return 99;
  const [first,last,low,high]=percentileBands.find(b=>score<=b[1]);
  return low+Math.round((Math.max(first,score)-first)*(high-low)/(last-first));
}
function budgetPoints(bill,lo,hi){
  if(bill>hi)return 100-(9+(bill-hi)/hi*170);
  if(bill<lo)return 100-Math.min(42,(lo-bill)/lo*55);
  return 100;
}

function readProgress(){
  try{
    while(localStorage.getItem(savePrefix+"pass."+progress.level)==="1")progress.level++;
    const raw=localStorage.getItem(achievementKey);
    let stored;
    try{stored=JSON.parse(raw)}catch{stored=[]}
    const ids=new Set(Array.isArray(stored)?stored:[]);
    for(const a of ACHIEVEMENTS){
      if(ids.has(a.id)||localStorage.getItem(savePrefix+a.id)==="1")progress.achievements.add(a.id);
    }
    const merged=JSON.stringify(ACHIEVEMENTS.filter(a=>progress.achievements.has(a.id)).map(a=>a.id));
    if(raw!==merged)localStorage.setItem(achievementKey,merged);
  }catch{storageOK=false}
}
function saveMark(key){
  try{localStorage.setItem(savePrefix+key,"1")}catch{storageOK=false}
}

async function playPaperMotion(element,frames,options){
  if(!element.animate||matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  let animation,timer;
  try{
    animation=element.animate(frames,options);
    // Some in-app browsers suspend their animation timeline when the tab loses focus.
    const fallback=new Promise(done=>{timer=setTimeout(done,options.duration+(options.delay||0)+80)});
    await Promise.race([animation.finished,fallback]);
  }catch{}finally{
    clearTimeout(timer);
    animation?.cancel();
  }
}

async function turnInOrder(){
  readProgress();
  report=judge(scene,order,{level:roundLevel,storeMenu,menuSeconds:menuElapsed/1000,edits:menuEdits});
  report.newAchievements=report.achievements.filter(id=>!progress.achievements.has(id));
  for(const id of report.newAchievements){
    progress.achievements.add(id);
    saveMark(id);
  }
  if(report.newAchievements.length)readProgress();
  if(report.passed){
    saveMark("pass."+roundLevel);
    progress.level=Math.max(progress.level,roundLevel+1);
  }
  pad.classList.add("flipping-slip");
  sheetFace.classList.add("awaiting-imprint");
  await playPaperMotion(sheetFace,[{transform:"rotateY(0deg)"},{transform:"rotateY(90deg)"}],
    {duration:280,easing:"ease-in"});
  stage="report";
  render(true);
  await playPaperMotion(sheetFace,[{transform:"rotateY(-90deg)"},{transform:"rotateY(0deg)"}],
    {duration:280,easing:"ease-out"});
  pad.classList.remove("flipping-slip");

  if(report.passed){

}

function readChallenge(search){
  const params=new URLSearchParams(search);
  const rank=params.get("rank");
  if(params.getAll("rank").length!==1||!sharedRanks.has(rank))return null;
  function integer(key,min,max){
    const raw=params.get(key);
    if(params.getAll(key).length!==1||!/^\d+$/.test(raw))return null;
    const value=Number(raw);
    return Number.isSafeInteger(value)&&value>=min&&value<=max?value:null;
  }
  const level=params.has("lv")?integer("lv",1,Number.MAX_SAFE_INTEGER):1;
  const score=integer("score",0,100),beat=integer("beat",1,99);
  if(level===null||score===null||beat===null)return null;
  return {level,rank,score,beat};
}
function shareDetails(){

  const best=notes.filter(n=>n.good).sort((a,b)=>b.priority-a.priority)[0]||notes[0];
  const restaurantName=scene.restaurantName;
  const text='【'+restaurantName+'】我在《点菜模拟器》第'+level+'关拿下'+score+'分，获封「'+rank+'」（'+stampNote+'），击败全国'+percentile+'%经手人！不服来开单踢馆：'+url.href;
  return {level,rank,stampNote,score,percentile,passed,restaurantName,sceneTitle:scene.title,quote:best.text,url:url.href,text};
}

async function copyShare(){
  const model=activeShare;
  if(!model||!shareModal.open)return;
  let copied=false;
  if(location.protocol!=="file:"){
    try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(model.text);copied=true}}catch{}
  }
  if(activeShare!==model||!shareModal.open)return;
  const copyButton=shareModal.querySelector("#shareCopy");
  const status=shareModal.querySelector("#shareStatus");
  if(!copied){
    let field=shareModal.querySelector("#shareManual");
    if(!field){
      field=document.createElement("textarea");
      field.id="shareManual";field.className="copy-field";field.readOnly=true;
      field.setAttribute("aria-label","完整战报与链接");
      field.value=model.text;
      copyButton.before(field);
    }
    field.focus({preventScroll:true});field.select();field.setSelectionRange(0,field.value.length);
    try{copied=document.execCommand("copy")}catch{}
    if(!copied){
      field.classList.add("manual");field.focus();field.select();
      status.textContent="请长按或按 Ctrl/Cmd+C 复制已选中的战报。";
      return;
    }
    field.remove();copyButton.focus({preventScroll:true});
  }
  shareModal.querySelector("#shareManual")?.remove();
  status.textContent="";
  copyButton.textContent="✓ 已复制，快去粘贴给好友";
}

function openBookCover(){
  bookCover.inert=true;
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){
    bookCover.hidden=true;
    return Promise.resolve();
  }
  return new Promise(resolve=>{
    const finish=()=>{
      clearTimeout(fallback);
      bookCover.removeEventListener("transitionend",onTurnEnd);
      bookCover.hidden=true;
      bookCover.classList.remove("opening");
      resolve();
    };
    const onTurnEnd=event=>{
      if(event.target===bookCover&&event.propertyName==="transform")finish();
    };
    const fallback=setTimeout(finish,720);
    bookCover.addEventListener("transitionend",onTurnEnd);
    bookCover.getBoundingClientRect(); // 先落实封皮起始位置，再沿书脊翻开。
    bookCover.classList.add("opening");
  });
}

function sketchType(dish){
  const {ingredientType:type,cookMethod:method,category}=dish;
  if(method==="cold")return type==="fish"&&category==="海鲜水产"?"sashimi":"cold_plate";
  if(category==="砂锅炖煲"||method==="stew_pot")return "claypot";
  if(method==="pan_fry"&&type==="mollusk")return "pan_fry_cake";
  if(method==="pan_fry"&&(type==="beef"||type==="mutton"))return "iron_plate";
  if(type==="pork"&&category==="招牌硬菜")return "meat_bowl";
  return foodSketches[type]||"stir_fry_meat";
}

    photo.onerror=()=>sketchPhotos.set(id,null);
    photo.src="img/"+id+".webp";

    queueMicrotask(()=>mountSketchPhoto(id));
  }
  const [vessel,ink,hatch]=sketchArt[sketchType(dish)];

// 排菜时只移动原有行。指针由不移动的列表捕获，插队过程中也能持续收到事件。
let queueDrag=null;
function moveQueueRow(row,to){
  const list=row.parentElement,from=Array.prototype.indexOf.call(list.children,row);
  if(from===to||to<0||to>=order.length)return;
  const moving=!row.animate||!row.getAnimations||matchMedia("(prefers-reduced-motion: reduce)").matches?[]:
    Array.from(list.children).slice(Math.min(from,to),Math.max(from,to)+1).filter(line=>line!==row)
      .map(line=>({line,top:line.getBoundingClientRect().top}));
  const [item]=order.splice(from,1);
  order.splice(to,0,item);
  const before=list.children[to+(to>from?1:0)]||null;
  list.insertBefore(row,before);
  Array.from(list.children).forEach((line,i)=>{
    line.querySelector(".seq").textContent=i+1;
    line.querySelector(".course").textContent=courseLabel(order[i].dish,i);
    line.querySelector('[data-act="up"]').disabled=i===0;
    line.querySelector('[data-act="down"]').disabled=i===order.length-1;
  });
  for(const {line,top} of moving){
    line.getAnimations().forEach(animation=>animation.cancel());
    const distance=top-line.getBoundingClientRect().top;
    line.animate([{transform:'translateY('+distance+'px)'},{transform:'translateY(0)'}],{duration:135,easing:"ease-out"});
  }
}
function placeQueueRow(drag){
  const {row,list,y,offset}=drag;
  const listTop=list.getBoundingClientRect().top;
  let to=0;
  for(const other of list.children){
    if(other===row)continue;
    if(y<listTop+other.offsetTop+other.offsetHeight/2)break;
    to++;
  }
  moveQueueRow(row,to);
  const top=listTop+row.offsetTop;
  row.style.setProperty("--slide",(y-offset-top)+"px");
}
function queueDragFrame(){
  const drag=queueDrag;
  if(!drag)return;
  drag.frame=0;
  const box=drag.body.getBoundingClientRect(),edge=Math.min(48,box.height/4);
  const depth=drag.y<box.top+edge?drag.y-box.top-edge:Math.max(0,drag.y-box.bottom+edge);
  const before=drag.body.scrollTop;
  drag.body.scrollTop+=Math.round(Math.max(-1,Math.min(1,depth/edge))*11);
  placeQueueRow(drag);
  if(drag.body.scrollTop!==before)drag.frame=requestAnimationFrame(queueDragFrame);
}
function finishQueueDrag(cancel){
  const drag=queueDrag;
  if(!drag)return;
  queueDrag=null;
  cancelAnimationFrame(drag.frame);
  if(cancel)moveQueueRow(drag.row,drag.start);
  else if(drag.moved)placeQueueRow(drag);
  drag.row.classList.remove("lifted");drag.row.style.removeProperty("--slide");
  if(drag.list.hasPointerCapture(drag.pointer))drag.list.releasePointerCapture(drag.pointer);
}

  if(a==="cat"){cat=b.dataset.cat;render();page.querySelector(".body").scrollTop=0;return}
  if(a==="kitchen"&&order.length&&!removing.size){stage="kitchen";return render(true)}
  if(a==="serve"&&stage==="kitchen"&&order.length)return settle();
  if(removing.has(id))return;
  if(a==="dish-detail"&&stage==="menu"){
    const open=b.getAttribute("aria-expanded")!=="true";
    detailChoices.set(id,open);
    const row=b.closest(".dish");
    row.classList.remove("just-checked");
    row.classList.toggle("open-detail",open);
    b.setAttribute("aria-expanded",String(open));
    document.getElementById(b.getAttribute("aria-controls")).setAttribute("aria-hidden",String(!open));
    return;
  }
  if(a==="add"&&stage==="menu"){
    const dish=storeMenu.find(d=>d.id===id);
    if(!dish)return;
    const newlyChecked=idx<0,animateDetails=newlyChecked&&!detailChoices.get(id);
    if(newlyChecked){order.push({dish,qty:1});detailChoices.delete(id)}
    else order[idx].qty++;
    menuEdits++;
    render();
    if(newlyChecked){
      const row=page.querySelector('[data-dish="'+id+'"]');
      if(animateDetails)row.classList.add("just-checked");
      row.querySelector(".dish-check").focus({preventScroll:true});
    }
  }else if((a==="minus"||a==="uncheck")&&stage==="menu"&&idx>=0){
    menuEdits++;
    if(a==="minus"&&order[idx].qty>1){order[idx].qty--;return render()}
    removing.add(id);render();
    setTimeout(()=>{
      const focusInRow=document.activeElement.closest(".dish")?.dataset.dish===id;
      order=order.filter(x=>x.dish.id!==id);removing.delete(id);detailChoices.delete(id);
      render();
      if(focusInRow){
        const target=reviewingOrder?(page.querySelectorAll(".dish-check")[Math.min(idx,order.length-1)]||page.querySelector('[data-act="review-order"]')):page.querySelector('[data-dish="'+id+'"] .dish-check');
        target?.focus({preventScroll:true});
      }
    },matchMedia("(prefers-reduced-motion: reduce)").matches?0:210);
  }else if((a==="up"||a==="down")&&idx>=0&&stage==="kitchen"){
    const next=idx+(a==="up"?-1:1);if(next<0||next>=order.length)return;
    const row=b.closest(".queue");
    moveQueueRow(row,next);
    (b.disabled?row.querySelector(".ctrl:not(:disabled)"):b)?.focus({preventScroll:true});
    row.scrollIntoView({block:"nearest"});
  }
});
shareModal.addEventListener("close",()=>{if(!shareModal.open)activeShare=null;nextReportDialog()});
document.addEventListener("close",syncMenuClock,true);
document.addEventListener("visibilitychange",syncMenuClock);
dialog.addEventListener("close",nextReportDialog);
achModal.addEventListener("close",nextReportDialog);
window.addEventListener("storage",event=>{
  if(event.key!==achievementKey&&!event.key?.startsWith(savePrefix))return;
  readProgress();
  if(turningPage){progressRefreshPending=true;return}
  if(stage==="cover"||stage==="report")render();else updateTag();
  if(achModal.open)archivePages.innerHTML=archive();
});
readProgress();
render();
if(window.location.protocol==="http:"||window.location.protocol==="https:"){
  const counterScript=document.createElement("script");
  counterScript.async=true;
  counterScript.src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js";
  document.head.appendChild(counterScript);
}
</script>

#dialog .cart-list{display:grid;align-content:start;gap:0;height:clamp(92px,30dvh,196px);margin:0 0 7px;padding:0;overflow-y:auto;list-style:none;overscroll-behavior:contain}
#dialog .cart-list li{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:7px;padding:5px 0;border-bottom:1px dotted var(--line);overflow-wrap:anywhere}
#dialog .cart-kick{min-height:36px;padding:4px 7px;background:var(--pen);color:var(--paper);border-color:var(--pen);white-space:nowrap}
#dialog .cart-finish{min-height:32px}
#dialog .cart-tray{position:relative}
#dialog .cart-list{overflow-x:hidden;overflow-anchor:none}
#cart-countdown.urgent{display:inline-block;color:var(--pen);text-shadow:0 0 1px var(--pen)}
#dialog .cart-list .kicking span{text-decoration:line-through;text-decoration-color:var(--pen)}
#dialog .cart-saved{position:absolute;z-index:1;right:5px;pointer-events:none;padding:1px 4px;background:var(--paper);color:var(--blue);font:700 14px/1.2 var(--hand)}
@media(prefers-reduced-motion:no-preference){
  #dialog .cart-list .cart-spawned{animation:cart-flash .35s ease-out}
  #dialog .cart-list .kicking{animation:cart-kick-out .17s ease-in both}
  #dialog .cart-saved{animation:cart-saved-rise .58s ease-out both}
  @keyframes cart-flash{from{transform:translateY(-8px);background:color-mix(in srgb,var(--pen) 18%,transparent)}to{transform:translateY(0);background:transparent}}
  @keyframes cart-kick-out{to{transform:translateX(16px);opacity:0}}
  @keyframes cart-saved-rise{0%{transform:translateY(0);opacity:1}55%{opacity:1}100%{transform:translateY(-12px);opacity:0}}
}
#shareImagePreview{margin-top:15px;border-top:1px dashed var(--line)}
#shareImagePreview p{margin:9px 0;font-size:13px;color:var(--muted)}
#shareImagePreview img{display:block;width:100%;height:auto;-webkit-touch-callout:default;user-select:auto}

function selectSideQuest(completedLevel,seenIds,random=Math.random){
  if(!Number.isInteger(completedLevel)||completedLevel<3||completedLevel===7||completedLevel===8)return null;
  const freePlay=completedLevel>8;
  const seen=new Set(seenIds);
  if(completedLevel===3&&seen.size)return null;
  const remaining=SIDE_QUESTS.filter(quest=>!seen.has(quest.id));
  const chance=freePlay?0.35:completedLevel===3||completedLevel===6?1:0.3;
  if(!remaining.length||(chance<1&&random()>=chance))return null;
  return remaining[Math.floor(random()*remaining.length)];
}

function createSeededRng(seedNum){
  let state=seedNum>>>0;
  return ()=>{
    state=(state+0x6d2b79f5)>>>0;
    let mixed=Math.imul(state^(state>>>15),state|1);
    mixed^=mixed+Math.imul(mixed^(mixed>>>7),mixed|61);
    return ((mixed^(mixed>>>14))>>>0)/4294967296;
  };
}

  street:{price:4,words:"四"},

const STORE_PRICE_RATES={
  mid_high:{street:1.2},
  luxury:{street:1.5,mid_high:1.2}
};

function priceStoreDish(dish,tier){
  if(dish.id==="dish_89"){
    const {price,words}=TEA_SEAT_RATES[tier];
    return {...dish,price,spec:"每位 ¥"+price,menuDesc:"按实际到席人数开茶摆位，每位"+words+"元。"};
  }
  const rate=STORE_PRICE_RATES[tier]?.[dish.minTier];
  if(!rate||dish.price<=0)return dish;
  return {...dish,price:Math.round(dish.price*rate/2)*2};
}

function generateRoguelikeScenario(rng=Math.random,{daily=false}={}){
  const regions=Object.keys(CUISINE_LABELS);
  const pick=items=>items[Math.floor(rng()*items.length)];
  const region=pick(regions);
  const place=ROGUE_RESTAURANTS[region];
  const tierIndex=daily?1+Math.floor(rng()*2):Math.floor(rng()*ROGUE_TIERS.length);
  const tier=ROGUE_TIERS[tierIndex];
  const headcount=daily?5+Math.floor(rng()*4):3+Math.floor(rng()*6);
  const occasion=pick(ROGUE_OCCASIONS);
  const available=ROGUE_AFFIXES.slice();
  const affixCount=daily?2:1+Math.floor(rng()*2);
  const affixes=[];
  while(affixes.length<affixCount){
    affixes.push(available.splice(Math.floor(rng()*available.length),1)[0]);
  }

  const guestTraits={needsPrestigeface:tier.id==="luxury"};
  const goutAlert=affixes.some(affix=>affix.goutAlert);
  const noAlcohol=affixes.some(affix=>affix.noAlcohol);
  const noDuplicateMeat=affixes.some(affix=>affix.noDuplicateMeat);
  const tightBudget=affixes.some(affix=>affix.tightBudget);
  for(const affix of affixes){
    if(affix.trait)guestTraits[affix.trait]=true;
  }
  let hiddenTrait="",hiddenClue="";
  if(rng()<(daily?0.6:0.4)){
    hiddenTrait=goutAlert?"avoidSeafood":"avoidSpicy";
    guestTraits[hiddenTrait]=true;
    hiddenClue=goutAlert
      ?"有位来宾翻到水产那页便把菜单往外推了推，夹菜前只问这桌会不会吃得太重。"
      :"有位来宾一看菜单上的红油图样，就放下筷子，把茶杯攥得更紧了。";
  }
  const guidance=affixes.map(affix=>affix.trait==="avoidSeafood"&&hiddenTrait==="avoidSeafood"
    ?"有两盘油重的肉菜就容易吃过量，肉菜别堆满一桌。"
    :affix.hint);
  if(hiddenClue)guidance.push(hiddenClue);

  const teaCost=isTeaRegion(region)?TEA_SEAT_RATES[tier.id].price*headcount:0;
  const budgetMax=tier.perGuest*headcount+teaCost+2*Math.floor(rng()*10);
  const budgetMin=tightBudget?budgetMax-15:Math.round(budgetMax*0.7);
  const menuSeed=Math.floor(rng()*4294967296);
  const restaurantName=place.names[tierIndex];
  const mode=daily?"daily":"roguelike";
  return {
    id:mode+"_"+menuSeed,mode,region,tier:tier.id,headcount,budgetMin,budgetMax,menuSeed,
    title:occasion.title+"·"+restaurantName,restaurantName,
    regionLabel:place.city+"·"+CUISINE_LABELS[region],
    tierLabel:tier.name+" · 全桌最多 "+budgetMax+" 元",
    tableNames:tier.tables.slice(),guestTraits,goutAlert,noAlcohol,noDuplicateMeat,
    affixes:affixes.map(affix=>affix.name),hiddenTrait,hiddenClue,
    guestsSummary:"你与"+(headcount-1)+"位来宾同桌。"+guidance.join(""),
    purpose:occasion.purpose+(guestTraits.needsPrestigeface?"主宾想要一道撑得起席面的硬菜。":"")
  };
}

function drawScenario(level,_previous,random=Math.random){
  if(Number.isInteger(level)&&level>=1&&level<=SCENARIOS.length){
    const scene=SCENARIOS[level-1];
    return {...scene,guestTraits:{...scene.guestTraits},tableNames:scene.tableNames.slice()};
  }
  return generateRoguelikeScenario(random);
}

const TEA_HOUSE_DISH_IDS=new Set(["dish_19","dish_26","dish_37","dish_39","dish_44","dish_89","dish_94","dish_95"]);
function buildStoreMenu(scenario,allDishes=DISHES){
  if(scenario.isSideQuest){
    const menu=SP_MENUS.find(m=>m.id===scenario.id);
    return menu?menu.dishes.slice():[];
  }
  const {region,mode,tier}=scenario;
  const frugal=mode==="frugal";
  let seed=(scenario.menuSeed??scenario.level??1)>>>0;
  function random(){
    seed=(Math.imul(1664525,seed)+1013904223)>>>0;
    return seed/4294967296;
  }
  const tierOrder={street:1,mid_high:2,luxury:3};
  const deck=allDishes.filter(d=>d.regions.includes(region)&&tierOrder[d.minTier]<=tierOrder[tier]);
  if(mode==="tea"){
    const houseMenu=deck.filter(d=>TEA_HOUSE_DISH_IDS.has(d.id)&&!d.tags.includes("alcohol"));
    return TEA_DIMSUM.concat(houseMenu.map(dish=>priceStoreDish(dish,tier)));
  }
  for(let i=deck.length-1;i>0;i--){
    const j=Math.floor(random()*(i+1));
    [deck[i],deck[j]]=[deck[j],deck[i]];
  }
  // 赠品同样占水单行数。先算出付费项可用的位数，再给本地招牌和本关必需品留位。
  let slots;
  if(tier==="street")slots=18+Math.floor(random()*4)-(frugal?FRUGAL_FREEBIES.length:0);
  else if(tier==="mid_high")slots=24+Math.floor(random()*4);
  else slots=28+Math.floor(random()*5);

  const essentials=new Set(["dish_26","dish_36","dish_46","dish_50","dish_52"]);
  if(mode==="roguelike"||mode==="daily"){
    for(const id of ["dish_37","dish_63","dish_88"])essentials.add(id);
    if(tier!=="street")essentials.add("dish_59");
  }
  if(frugal)essentials.add("dish_49");
  if(mode==="reunion"){
    for(const id of ["dish_55","dish_56","dish_86","dish_98","dish_99"])essentials.add(id);
  }
  if(scenario.requiresHeat){essentials.add("dish_87");essentials.add("dish_88");}
  if(scenario.mustHighEndAlcohol)essentials.add("dish_84");
  if(tier==="mid_high"||tier==="luxury"){
    for(const id of ["dish_13","dish_15","dish_33","dish_54"])essentials.add(id);
  }
  if(tier==="luxury"){
    for(const id of ["dish_29","dish_38","dish_59","dish_60","dish_63","dish_73","dish_75"])essentials.add(id);
  }
  const selected=new Set(deck.filter(d=>essentials.has(d.id)||d.tags.includes("local_signature")||d.tags.includes("tea_fee")));
  const represented=new Set([...selected].map(menuCategoryLabel));
  for(const d of deck){
    if(selected.size>=slots)break;
    const category=menuCategoryLabel(d);
    if(!represented.has(category)){selected.add(d);represented.add(category);}
  }
  for(const d of deck){
    if(selected.size>=slots)break;
    selected.add(d);
  }
  const menu=deck.filter(d=>selected.has(d));
  if(!frugal)return menu.map(dish=>priceStoreDish(dish,tier));
  const paid=menu.map(d=>{
    if(d.id==="dish_50")return {...d,price:6,spec:"一人一碗",portion:1,stapleServings:1,menuDesc:"六块钱盛一大碗，每人一份。"};
    if(d.id==="dish_49")return {...d,price:8,spec:"一人一盘",portion:1,stapleServings:1,menuDesc:"老街小份现炒，一盘管饱一个人。"};
    return d;
  });
  return FRUGAL_FREEBIES.concat(paid);
}

const CAMPAIGN_PASS_SCORES=[60,65,70,75,80,85,85,80];
function passScore(level){return level>CAMPAIGN_PASS_SCORES.length?82:CAMPAIGN_PASS_SCORES[level-1]??60}
const percentileBands=[[0,39,1,17],[40,59,18,41],[60,69,42,61],[70,79,62,77],
  [80,89,78,90],[90,95,91,95],[96,99,96,98]];
function estimatePercentile(score){
  if(score>=100)return 99;
  const [first,last,low,high]=percentileBands.find(b=>score<=b[1]);
  return low+Math.round((Math.max(first,score)-first)*(high-low)/(last-first));
}
function budgetPoints(bill,budgetMin,budgetMax){
  if(budgetMax===Infinity)return 100;
  if(bill>budgetMax)return 100-(9+(bill-budgetMax)/budgetMax*170);
  if(bill<budgetMin)return 100-Math.min(42,(budgetMin-bill)/budgetMin*55);
  return 100;
}
function orderLineQuantity(scenario,{dish,qty}){
  return qty>0&&dish.tags.includes('tea_fee')?scenario.headcount:qty;
}
function orderLineTotal(scenario,entry){
  return entry.dish.price*orderLineQuantity(scenario,entry);
}
function orderSubmissionIssue(scenario,order){
  const entries=order.filter(r=>r.qty>0);
  if(scenario.mode!=='frugal')return '';
  const claimed=new Set();
  for(const {dish,qty} of entries){
    if(dish.maxQty!==1)continue;
    if(qty!==1||claimed.has(dish.id))return dish.name+'每桌限领一份。';
    claimed.add(dish.id);
  }
  return '';
}
function judgeSideQuest(scenario,order,level){
  const items=order.filter(row=>row.qty>0);
  const bill=items.reduce((sum,row)=>sum+orderLineTotal(scenario,row),0);
  const difference=bill-scenario.budgetMax;
  const budgetFit=delta=>Math.max(0,100-2*Math.abs(delta));
  let score,awardId,reason,text,checks;
  if(scenario.id==='sp_friday'){
    const salad=items.some(row=>row.dish.tags.includes('salad_trap'));
    const eligible=items.length>0&&items.every(row=>row.dish.tags.includes('friday_ok'));
    checks=[['转账对账',budgetFit(difference)],['余款核对',budgetFit(Math.min(0,difference))],
      ['垫款核对',budgetFit(Math.max(0,difference))],['餐品核对',eligible?100:0],['忌菜核对',salad?0:100]];
    if(items.length===1&&items[0].qty===2&&salad&&bill===50){
      score=98;awardId='ach_grass_crowd';reason='两盒草料破例放行';
    }else if(salad){
      score=25;reason='草料上了桌';
      text='堂堂疯狂星期五，你拿别人转你的五十块钱点了一盒草？！原味炸鸡的脸都被你丢尽了！';
    }else if(difference!==0){
      score=Math.max(0,98-2*Math.abs(difference));reason='转账没对上';
      text='说好五十块一分不剩，你这算术水平连炸鸡铺收银员都替你着急。';
    }else if(!eligible){
      score=75;reason='五十块花偏了';
      text='五十块的账是平了，可薯泥占了炸鸡的份额。下回给他装炸鸡、蛋挞或快乐水，这张单子才算齐活。';
    }else{
      score=100;awardId='ach_friday';reason='炸鸡账清';
    }
  }else if(scenario.id==='sp_silver'){
    const count=tag=>items.reduce((sum,row)=>sum+(row.dish.tags.includes(tag)?row.qty:0),0);
    const white=count('white_zone'),red=count('red_zone');
    const servings=items.reduce((sum,row)=>sum+row.qty,0);
    const matched=white===2&&red===2&&servings===4&&bill===28;
    const portionFit=(amount,wanted)=>Math.max(0,100-50*Math.abs(amount-wanted));
    checks=[['账单总额',budgetFit(difference)],['白区份数',portionFit(white,2)],['红区份数',portionFit(red,2)],
      ['两区配对',portionFit(white-red,0)],['双人份量',portionFit(servings,4)]];
    if(matched){
      score=98;awardId='ach_silver';reason='两套餐点齐了';
    }else if(servings===4&&(white===4||red===4)){
      score=98;awardId='ach_mcd_rebel';reason='单色套餐破例放行';
    }else{
      score=35;reason='套餐配错了';
      text='连 1+1 随心配的【一白配一红】死规矩都敢打破，银拱门点餐机都要被你按冒烟了！';
    }
  }else{
    throw new RangeError('未知的支线派单：'+scenario.id);
  }
  const award=ACHIEVEMENTS.find(a=>a.id===awardId);
  const passed=Boolean(award);
  const {rank,stampNote}=RANK_TIERS.find(t=>score<=t.max);
  const notes=[{priority:100,dish:award?award.name:'本桌水单',reason,text:award?award.comment:text,good:passed}];
  return {sideQuestId:scenario.id,level,passScore:98,passed,score,rank,stampNote,bill,paid:bill,percentile:estimatePercentile(score),
    dimensions:checks.map(([label,value])=>({label,value})),fatal:'',notes,achievements:award?[award.id]:[]};
}

// 音频设备只在玩家第一次操作后启动；各声部共用静音总线。
const SoundFX=(()=>{
  let context=null,master=null,noiseBuffer=null,muted=false;
  let pending=null,lastTick=-Infinity;
  const active=new Set();

  function syncMute(){
    try{
      const button=document.getElementById("muteBtn");
      button.textContent=muted?"🔇":"🔊";
      button.setAttribute("aria-pressed",String(muted));
      button.setAttribute("aria-label",muted?"开启音效":"关闭音效");
      if(master)master.gain.value=muted?0:1;
      if(muted){
        pending=null;
        for(const source of active){try{source.stop()}catch{}}
      }
    }catch{}
  }
  function init(){
    try{
      try{muted=localStorage.getItem(savePrefix+"muted")==="true"}catch{}
      syncMute();
    }catch{}
  }
  function flush(){
    try{
      if(!pending||context?.state!=="running")return;
      const cue=pending;
      pending=null;
      if(!muted&&performance.now()-cue.time<=220)synthesize(cue.name);
    }catch{}
  }
  function unlock(){
    try{
      if(muted)return;
      if(!context||context.state==="closed"){
        const Audio=window.AudioContext||window.webkitAudioContext;
        if(!Audio)return;
        context=new Audio();
        master=context.createGain();
        master.gain.value=1;
        master.connect(context.destination);
        noiseBuffer=null;
        context.onstatechange=flush;
      }
      if(context.state!=="running")context.resume()?.then(flush,()=>{});
    }catch{}
  }
  function toggle(){
    try{
      muted=!muted;
      syncMute();
      try{localStorage.setItem(savePrefix+"muted",String(muted))}catch{}
      if(!muted){unlock();play("tap")}
    }catch{}
  }
  function voice(source,filter,start,duration,volume,attack){
    let envelope;
    function release(){
      try{
        active.delete(source);
        source.disconnect();filter?.disconnect();envelope?.disconnect();
      }catch{}
    }
    try{
      envelope=context.createGain();
      const gain=envelope.gain;
      gain.setValueAtTime(0.0001,start);
      gain.linearRampToValueAtTime(volume,start+attack);
      if(filter&&duration>0.1)gain.linearRampToValueAtTime(volume*0.75,start+duration*0.55);
      gain.exponentialRampToValueAtTime(0.0001,start+duration);
      if(filter){source.connect(filter);filter.connect(envelope)}else source.connect(envelope);
      envelope.connect(master);
      source.onended=release;
      active.add(source);
      source.start(start);
      source.stop(start+duration);
    }catch{release()}
  }
  function tone(type,from,to,start,duration,volume,attack=0.002){
    try{
      const osc=context.createOscillator();
      osc.type=type;
      osc.frequency.setValueAtTime(from,start);
      if(from!==to)osc.frequency.exponentialRampToValueAtTime(to,start+duration);
      voice(osc,null,start,duration,volume,attack);
    }catch{}
  }
  function noise(type,from,to,q,start,duration,volume){
    try{
      if(!noiseBuffer){
        noiseBuffer=context.createBuffer(1,Math.ceil(context.sampleRate*0.22),context.sampleRate);
        const samples=noiseBuffer.getChannelData(0);
        // 独立的白噪声，不消耗抽单使用的随机数。
        let seed=0x6d2b79f5;
        for(let i=0;i<samples.length;i++){
          seed^=seed<<13;seed^=seed>>>17;seed^=seed<<5;
          samples[i]=(seed>>>0)/2147483648-1;
        }
      }
      const source=context.createBufferSource(),filter=context.createBiquadFilter();
      source.buffer=noiseBuffer;
      filter.type=type;
      filter.Q.value=q;
      filter.frequency.setValueAtTime(from,start);
      if(from!==to)filter.frequency.exponentialRampToValueAtTime(to,start+duration);
      voice(source,filter,start,duration,volume,0.003);
    }catch{}
  }
  function synthesize(name){
    try{
      const now=context.currentTime;
      switch(name){
        case "paper":
          noise("bandpass",850,1750,1.2,now,0.22,0.19);break;
        case "check":
          noise("highpass",2200,2200,0.7,now,0.05,0.12);
          tone("sine",650,980,now,0.025,0.05);break;
        case "uncheck":
          noise("bandpass",2400,1500,1.1,now,0.042,0.16);
          noise("bandpass",2400,1500,1.1,now+0.06,0.038,0.12);break;
        case "tap":
          tone("triangle",190,85,now,0.03,0.045);break;
        case "tick":
          tone("sine",440,160,now,0.025,0.10);break;
        case "bell":
          tone("sine",1320,1320,now,0.65,0.14,0.005);
          tone("sine",2640,2640,now,0.40,0.055,0.005);
          tone("sine",3960,3960,now,0.24,0.025,0.005);break;
        case "stamp":
          tone("sine",145,42,now,0.12,0.23);
          noise("lowpass",1150,650,0.7,now,0.03,0.25);break;
      }
    }catch{}
  }
  function play(name){
    try{
      if(muted||!context)return;
      if(context.state!=="running"){
        pending={name,time:performance.now()};
        return;
      }
      pending=null;
      synthesize(name);
    }catch{}
  }
  return {
    init,unlock,toggle,
    paper(){try{play("paper")}catch{}},
    check(){try{play("check")}catch{}},
    uncheck(){try{play("uncheck")}catch{}},
    tap(){try{play("tap")}catch{}},
    tick(){
      try{
        const now=performance.now();
        if(now-lastTick<35)return;
        lastTick=now;
        play("tick");
      }catch{}
    },
    bell(){try{play("bell")}catch{}},
    stamp(){try{play("stamp")}catch{}}
  };
})();

      for(const quest of SIDE_QUESTS)if(saved.seen.includes(quest.id))state.seen.add(quest.id);
    }
    const next=saved?.pending;
    if(next&&state.seen.has(next.id)&&Number.isInteger(next.mainStageIdx)&&next.mainStageIdx>=4&&next.mainStageIdx<=lastLevel+1)
      state.pending={id:next.id,mainStageIdx:next.mainStageIdx};
  }catch{}

}

async function playPaperMotion(element,frames,options){
  if(!element.animate||matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  let animation,timer;
  try{
    animation=element.animate(frames,options);
    // Some in-app browsers suspend their animation timeline when the tab loses focus.
    const fallback=new Promise(done=>{timer=setTimeout(done,options.duration+(options.delay||0)+80)});
    await Promise.race([animation.finished,fallback]);
  }catch{}finally{
    clearTimeout(timer);
    animation?.cancel();
  }
}

function revealReportScore(scoreValue,target,motion){
  if(motion.matches){scoreValue.textContent=target;return}
  page.querySelector(".bars")?.classList.add("revealing");
  const started=performance.now();
  function roll(now){
    if(!scoreValue.isConnected)return;
    if(motion.matches||now-started>=520){
      scoreValue.textContent=target;
      if(motion.matches)return;
      if(target>=85)scoreValue.parentElement.classList.add("score-high");
      if(target<=39)scoreValue.parentElement.classList.add("score-low");
      return;
    }
    const time=Math.max(0,(now-started)/520);
    const value=String(Math.floor(target*(1-(1-time)**3)));
    if(scoreValue.textContent!==value)scoreValue.textContent=value;
    requestAnimationFrame(roll);
  }
  requestAnimationFrame(roll);
}

function startReceiptPrint(){
  const receipt=page.querySelector(".guest-check");
  const motion=matchMedia("(prefers-reduced-motion: no-preference)");
  if(!receipt||!motion.matches){receiptPrintPending=false;return}

  receipt.classList.add("printing","waiting");
  receipt.addEventListener("animationend",()=>receipt.classList.remove("printing"),{once:true});
  function begin(){
    if(!receipt.isConnected||stage!=="report"||!receipt.classList.contains("waiting"))return;
    receiptObserver?.disconnect();
    receiptObserver=null;
    receiptPrintPending=false;
    receipt.classList.remove("waiting");
    if(!motion.matches){receipt.classList.remove("printing");return}
    if(typeof SoundFX==="undefined"||typeof SoundFX.tick!=="function")return;
    for(let step=1;step<=4;step++){
      setTimeout(()=>{
        if(stage!=="report"||!receipt.isConnected||!motion.matches)return;
        try{SoundFX.tick()}catch{}
      },step*140);
    }
  }
  if(typeof IntersectionObserver==="undefined"){begin();return}
  // 小票通常在首屏下方，露出纸头之后再开始走纸。
  receiptObserver=new IntersectionObserver(entries=>{
    if(entries.some(entry=>entry.isIntersecting&&entry.intersectionRect.height>0))begin();
  },{root:receipt.closest(".body"),rootMargin:"0px 0px -16px"});
  receiptObserver.observe(receipt);
}

function readChallenge(search){
  const params=new URLSearchParams(search);
  const rank=params.get("rank");
  if(params.getAll("rank").length!==1||!sharedRanks.has(rank))return null;
  function integer(key,min,max){
    const raw=params.get(key);
    if(params.getAll(key).length!==1||!/^\d+$/.test(raw))return null;
    const value=Number(raw);
    return Number.isSafeInteger(value)&&value>=min&&value<=max?value:null;
  }
  const level=params.has("lv")?integer("lv",1,Number.MAX_SAFE_INTEGER):1;
  const score=integer("score",0,100),beat=integer("beat",1,99);
  if(level===null||score===null||beat===null)return null;
  const side=SIDE_QUESTS.find(q=>q.id===params.get("side"));
  const daily=params.getAll("daily").length===1?examDate(params.get("daily")):null;
  return {level,rank,score,beat,side,daily,freePlay:params.get("mode")==="free"};
}

function openBookCover(){
  bookCover.inert=true;
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){
    bookCover.hidden=true;
    return Promise.resolve();
  }
  return new Promise(resolve=>{
    const finish=()=>{
      clearTimeout(fallback);
      bookCover.removeEventListener("transitionend",onTurnEnd);
      bookCover.hidden=true;
      bookCover.classList.remove("opening");
      resolve();
    };
    const onTurnEnd=event=>{
      if(event.target===bookCover&&event.propertyName==="transform")finish();
    };
    const fallback=setTimeout(finish,720);
    bookCover.addEventListener("transitionend",onTurnEnd);
    bookCover.getBoundingClientRect(); // 先落实封皮起始位置，再沿书脊翻开。
    bookCover.classList.add("opening");
  });
}

  if(method==="pan_fry"&&(type==="beef"||type==="mutton"))return "iron_plate";

}

function getDishWhisper(scene,dish){
  const has=tag=>dish.tags.includes(tag);
  if((scene.hiddenTrait==="avoidSpicy"&&dish.spicy>0)||
    (scene.hiddenTrait==="avoidSeafood"&&(dish.category==="海鲜水产"||["fish","shrimp_crab"].includes(dish.ingredientType)||has("seafood"))))
    return "秘书偷偷朝你使眼色（有人忌口！）";
  if(has("salad_trap"))return "疯五点草，叛徒实锤！";
  if(has("premium_alcohol"))return "好家伙，财务提刀来了";
  if(scene.noAlcohol&&has("alcohol"))return "这桌禁酒，你想吹哨？";
  if(scene.guestTraits?.avoidSeafood&&(dish.category==="海鲜水产"||has("seafood")))return "有人海鲜忌口，手滑了？";
  if(scene.guestTraits?.avoidSpicy&&dish.spicy>0)return "客人口味忌辣，慎点！";
  if(scene.mode==="family"&&(has("bony_messy")||["dish_14","dish_56","dish_61","dish_81"].includes(dish.id)))return "老丈人牙口可咬不动";
  if(scene.tier!=="street"&&has("premade_suspect"))return "后厨撕包加热警告";
  if(!scene.isSideQuest&&has("local_signature")&&!dish.regions.includes(scene.region))return "外地招牌，后厨得现学";
  if(dish.price===0)return "老板：这桌算你白嫖";
  if(dish.spicy>=3)return "够劲！小心辣冒汗";
  if(has("coconut")||has("spice_relief"))return "懂行，解辣神器备上";
  if(dish.prestige>=90)return "硬菜镇桌，排面拉满";
  return "";
}
function pinDishWhisper(dish){
  const text=getDishWhisper(scene,dish);
  const notes=text?[{text,duration:1550}]:[];
  const companions=order.filter(row=>row.dish.id!==dish.id&&row.qty>0&&!removing.has(row.dish.id)).map(row=>row.dish);
  for(const combo of dishCombos){
    if(seenDishCombos.has(combo.id))continue;
    const hasLeft=companions.some(combo.left),hasRight=companions.some(combo.right);
    if((hasLeft&&hasRight)||!((combo.left(dish)&&hasRight)||(combo.right(dish)&&hasLeft)))continue;
    seenDishCombos.add(combo.id);
    notes.push({text:combo.text,duration:2100,combo:true});
  }
  if(!notes.length)return;
  // 水单重绘时沿用原始起点，让批注和搭配浮签各自按时收笔。
  const whisper={notes,startedAt:performance.now()};
  dishWhispers.set(dish.id,whisper);
  notes.forEach(({duration},index)=>setTimeout(()=>{
    if(dishWhispers.get(dish.id)!==whisper)return;
    const group=page.querySelector('[data-dish="'+dish.id+'"] .dish-whispers');
    if(index===notes.length-1){
      dishWhispers.delete(dish.id);
      group?.remove();
    }else group?.querySelector('[data-whisper="'+index+'"]')?.remove();
  },duration));
}

    attrs+'aria-label="'+d.name+'，'+d.spec+'，菜品详情" aria-expanded="'+open+'" aria-controls="'+detailsId+'"');
  const check=soldOut?action("add","已沽清","smallbtn sold-out",attrs+'disabled aria-label="'+d.name+'已沽清"'):action(item?"uncheck":"add",'<span aria-hidden="true">'+(item?'✓':'')+'</span>',"dish-check",

    action("minus","−","ctrl",attrs+'aria-label="减少'+d.name+'一份"')+
    '<span class="qty">'+item.qty+' 份</span>'+
    action("add","＋","ctrl",attrs+'aria-label="增加'+d.name+'一份"')+'</div>':'';
  const whisper=dishWhispers.get(d.id);
  const elapsed=whisper?Math.floor(performance.now()-whisper.startedAt):0;
  const notes=whisper?.notes.map(({text,combo,duration},index)=>elapsed<duration
    ?'<span class="pen-whisper'+(combo?' combo':'')+'" data-whisper="'+index+'" style="--whisper-time:'+duration+'ms;animation-delay:-'+elapsed+'ms">'+text+'</span>':'').join("")||"";
  const note=notes?'<div class="dish-whispers" aria-hidden="true">'+notes+'</div>':"";
  return '<article class="dish'+(open?' open-detail':'')+(open&&detailChoices.get(d.id)?' view-art':'')+(unchecking?' unchecking':'')+'" data-dish="'+d.id+'">'+detail+
    '<div class="dish-sale"><span class="price">¥'+d.price+'</span>'+check+'</div>'+
    '<div class="dish-desc" id="'+detailsId+'" aria-hidden="'+!open+'"><span>'+d.menuDesc+'</span></div>'+quantity+note+'</article>';
}

function courseLabel(dish,i){
  if(dish.tags.includes("tea_fee"))return "全桌 · 按位计费";
  if(dish.category==="drinks")return dish.tags.includes("alcohol")?"随席 · 酒水":"随席 · 饮品";
  const position=i===0?"头道":i===order.length-1?"收尾":"席中";
  let course="主菜";
  if(dish.ingredientType==="drink")course="茶水";
  else if(dish.ingredientType==="staple")course="主食";
  else if(dish.ingredientType==="soup"||dish.cookMethod==="soup")course="汤品";
  else if(dish.cookMethod==="cold"||dish.category==="凉菜卤味")course="冷盘";
  else if(dish.ingredientType==="veg"||dish.ingredientType==="tofu")course=i<2?"前菜":"配菜";
  return position+" · "+course;
}

let queueDrag=null;
function moveQueueRow(row,to){
  const list=row.parentElement,from=Array.prototype.indexOf.call(list.children,row);
  if(from===to||to<0||to>=order.length)return;
  const moving=!row.animate||!row.getAnimations||matchMedia("(prefers-reduced-motion: reduce)").matches?[]:
    Array.from(list.children).slice(Math.min(from,to),Math.max(from,to)+1).filter(line=>line!==row)
      .map(line=>({line,top:line.getBoundingClientRect().top}));
  const [item]=order.splice(from,1);
  order.splice(to,0,item);
  SoundFX.tick();
  const rows=Array.from(list.children);
  if(from<to){
    for(const sibling of rows.slice(from+1,to+1))list.insertBefore(sibling,row);
  }else{
    const after=row.nextSibling;
    for(const sibling of rows.slice(to,from))list.insertBefore(sibling,after);
  }
  Array.from(list.children).forEach((line,i)=>{
    line.querySelector(".seq").textContent=i+1;
    line.querySelector(".course").textContent=courseLabel(order[i].dish,i);
    line.querySelector('[data-act="up"]').disabled=i===0;
    line.querySelector('[data-act="down"]').disabled=i===order.length-1;
  });
  for(const {line,top} of moving){
    line.getAnimations().forEach(animation=>animation.cancel());
    const distance=top-line.getBoundingClientRect().top;
    line.animate([{transform:'translateY('+distance+'px)'},{transform:'translateY(0)'}],{duration:135,easing:"ease-out"});
  }
}

function placeQueueRow(drag){
  const {row,list,offset}=drag;
  const box=queueViewport(drag);
  const y=Math.max(box.top,Math.min(drag.y,box.bottom));
  const listTop=list.getBoundingClientRect().top+list.clientTop-list.scrollTop;
  let to=0;
  for(const other of list.children){
    if(other===row)continue;
    if(y<listTop+other.offsetTop+other.offsetHeight/2)break;
    to++;
  }
  moveQueueRow(row,to);
  const last=list.lastElementChild;
  const limit=last.offsetTop+last.offsetHeight-row.offsetHeight;
  const top=Math.max(0,Math.min(y-offset-listTop,limit));

function queueDragFrame(){

  const box=queueViewport(drag),edge=Math.max(1,Math.min(48,(box.bottom-box.top)/4));
  const depth=drag.y<box.top+edge?drag.y-box.top-edge:Math.max(0,drag.y-box.bottom+edge);
  const step=Math.round(Math.max(-1,Math.min(1,depth/edge))*11);
  const listBefore=drag.list.scrollTop,bodyBefore=drag.body.scrollTop;
  drag.list.scrollTop+=step;
  if(step&&drag.list.scrollTop===listBefore)drag.body.scrollTop+=step;

function stampReportMeta(awards){
  const details=meta();
  if(!awards.length)return details;
  const angles=[-11,7,-4,13],nudges=[-4,4,-5,3];
  const stamps=awards.map((award,index)=>{
    const position=index%angles.length;
    return awardStamp(award,'--stamp-index:'+index+';--stamp-nudge:'+nudges[position]+'px;--stamp-angle:'+angles[position]+'deg');
  });
  return '<div class="meta-stamp-zone" style="--stamp-spaces:'+Math.max(1,awards.length-1)+'">'+details+stamps.join("")+'</div>';
}

function eventSafeDish(dish){
  const {avoidSeafood,avoidSpicy}=scene.guestTraits;
  const sea=dish.category==="海鲜水产"||["fish","shrimp_crab"].includes(dish.ingredientType)||dish.tags.includes("seafood");
  return !(avoidSeafood&&sea)&&!(avoidSpicy&&dish.spicy>0)&&!(scene.noAlcohol&&dish.tags.includes("alcohol"));
}

function triggerTableEvent(rng){
  const events=new Map();
  const byId=(a,b)=>a.id.localeCompare(b.id);
  const byPrice=(a,b)=>a.price-b.price||byId(a,b);
  const isPaid=d=>d.price>0&&!d.tags.includes("tea_fee");
  const isFood=d=>isPaid(d)&&d.ingredientType!=="drink";
  const isMildVeg=d=>d.ingredientType==="veg"&&d.heaviness<40;
  const isAlcohol=d=>d.tags.includes("alcohol");
  const isRelief=d=>d.tags.includes("spice_relief");
  const pickedIds=new Set(order.map(row=>row.dish.id));
  const ready=storeMenu.filter(d=>!soldOutIds.has(d.id)).sort(byId);
  const extraFood=ready.filter(d=>isFood(d)&&eventSafeDish(d)&&!pickedIds.has(d.id));
  const hardDish=d=>["招牌硬菜","海鲜水产","砂锅炖煲"].includes(d.category);

  const substitutions=[];
  for(const row of order.slice().sort((a,b)=>byId(a.dish,b.dish))){
    const target=row.dish;
    if(!isPaid(target)||scene.mustHighEndAlcohol&&target.tags.includes("premium_alcohol"))continue;
    const others=order.filter(item=>item!==row);
    if(scene.requiresHeat&&((target.spicy>=3&&!others.some(({dish})=>dish.spicy>=3))||
      (isRelief(target)&&!others.some(({dish})=>isRelief(dish)))))continue;
    const sameCategory=extraFood.filter(d=>d.category===target.category);
    const morePrestige=extraFood.filter(d=>hardDish(d)&&d.prestige>target.prestige);
    const premium=[...new Set([...sameCategory,...morePrestige])].sort((a,b)=>b.prestige-a.prestige||byPrice(a,b))[0];
    const outgoing=orderLineTotal(scene,row);
    const affordable=extraFood.filter(d=>d.price<=outgoing&&d.prestige<=70).sort(byPrice);
    const lowCost=scene.mode==="reunion"&&others.some(({dish})=>isAlcohol(dish))?
      affordable.find(d=>d.cookMethod==="cold"||d.tags.includes("cold_dish"))??affordable[0]:affordable[0];
    if(premium&&(lowCost||others.some(({dish})=>isFood(dish))))substitutions.push({target,premium,lowCost});
  }
  if(substitutions.length)events.set("soldout",()=>{
    const {target,premium,lowCost}=substitutions[Math.floor(rng()*substitutions.length)];
    function replaceSoldOut(dish){
      soldOutIds.add(target.id);
      dishWhispers.delete(target.id);
      if(dish)order=order.map(item=>item.dish.id===target.id?{dish,qty:1}:item);
      else order=order.filter(item=>item.dish.id!==target.id);
      if(reviewingOrder){
        reviewingOrder=false;
        cat=menuCategoryLabel(target);
      }
      return true;
    }
    return {title:"后厨临时沽清",message:"传菜员小跑过来擦汗：「不好意思，刚最后一份【"+target.name+"】被隔壁桌抢走了！」",options:{
      A:{label:"加钱保排面",detail:"换上"+premium.name+"（¥"+premium.price+"）",apply:()=>replaceSoldOut(premium)},
      B:{label:"省钱保实惠",detail:lowCost?"换上"+lowCost.name+"（¥"+lowCost.price+"）":"先撤菜，留出预算",apply:()=>replaceSoldOut(lowCost)}
    }};
  });

  const byVegFit=(a,b)=>Number(b.tags.includes("low_fat"))-Number(a.tags.includes("low_fat"))||
    Number(a.cookMethod==="cold")-Number(b.cookMethod==="cold")||byPrice(a,b);
  const mildVeg=extraFood.filter(isMildVeg).sort(byVegFit)[0]||ready.filter(d=>isMildVeg(d)&&eventSafeDish(d)&&
    order.some(row=>row.dish.id===d.id&&row.qty<(d.maxQty??Infinity))).sort(byVegFit)[0];
  if(scene.headcount<10&&!scene.guestTraits.hasFemaleWatchingDiet&&mildVeg)events.set("guest",()=>{
    function seatGuest(){
      scene.headcount++;
      for(const row of order)if(row.dish.tags.includes("tea_fee"))row.qty=scene.headcount;
      scene.guestTraits.hasFemaleWatchingDiet=true;
      scene.guestsSummary+="　临时多了一位控油轻食的女同事。";
      menuBriefOpen=true;
    }
    return {title:"微信临时来客",message:"主宾低头看了眼手机：「刚到楼下，临时多带一位女同事过来，她最近控油轻食，大家多担待。」（全桌人数 +1）",options:{
      A:{label:"周到加菜",detail:"添一份"+mildVeg.name+"（¥"+mildVeg.price+"）",apply:()=>{seatGuest();addEventDish(mildVeg);return true}},
      B:{label:"原菜匀着吃",detail:"维持菜单，按新人数考核",apply:()=>{seatGuest();return order.some(({dish})=>dish.tags.includes("low_fat")&&eventSafeDish(dish))}}
    }};
  });

  if(!scene.noAlcohol&&!scene.mustHighEndAlcohol)events.set("driving",()=>{
    // 柜台常备椰汁，即使开局水牌只抽到了酒水，也能顺手换饮料。
    const drink=ready.filter(d=>d.ingredientType==="drink"&&!isAlcohol(d)&&isRelief(d)).sort(byPrice)[0]||
      priceStoreDish(DISHES.find(d=>d.id==="dish_88"),scene.tier);
    function announceDriving(){
      scene.noAlcohol=true;
      scene.drivingAnnounced=true;
      scene.guestsSummary+="　下午全员开车去工地巡检，今席以茶饮代酒。";
      menuBriefOpen=true;
    }
    return {title:"下午临时开车",message:"主宾刚挂断电话：「下午临时通知全员开车去工地巡检，今天谁也别碰酒，以茶水饮料代酒！」",options:{
      A:{label:"当机立断换茶饮",detail:"撤掉所有酒，换一份"+drink.name+"（¥"+drink.price+"）",apply:()=>{
        announceDriving();
        order=order.filter(({dish})=>!isAlcohol(dish));
        if(!storeMenu.some(d=>d.id===drink.id))storeMenu.push(drink);
        addEventDish(drink);
        return true;
      }},
      B:{label:"先留着再说",detail:"酒单照旧",apply:()=>{announceDriving();return !order.some(({dish})=>isAlcohol(dish))}}
    }};
  });

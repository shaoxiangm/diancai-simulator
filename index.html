<style>

button:focus-visible,[tabindex="-1"]:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

#page{flex:1;min-height:0;display:flex;flex-direction:column}
.body{overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#ac978277 transparent;flex:1;min-height:0;padding:17px 23px 15px}

.ticket b{font-weight:normal;letter-spacing:.04em}

#fish{width:100%;height:auto;display:block;aspect-ratio:340/116}

.imprint{display:flex;justify-content:space-between;align-items:center;margin-top:10px;color:var(--muted);font:12px var(--serif);letter-spacing:.07em}.inks{color:var(--red);margin-right:4px;text-shadow:6px 0 var(--blue)}

.seal{position:relative;display:grid;align-content:center;justify-items:center;min-height:80px;border:3px solid currentColor;border-radius:50%;color:#a42b23;transform:rotate(-7deg);font-family:var(--serif);line-height:1.13;white-space:nowrap}

.seal::after{content:"";position:absolute;inset:-2px;border-radius:inherit;pointer-events:none;background:repeating-linear-gradient(112deg,transparent 0 13px,#f9ebe89c 13.5px,transparent 14.3px 24px)}

@media(max-height:760px){.binding{height:16px}.brand{padding-block:7px}.cover{gap:10px;padding-block:12px}.poster{padding-block:9px}.poster h1{font-size:44px}#fish{height:95px}.steps li{padding-block:5px}.imprint{margin-top:7px}}

@media(prefers-reduced-motion:reduce){*,*::after{animation-duration:.001ms!important;transition:none!important}}
</style>
</head>

// ==================== [MODULE 3: JUDGE_ENGINE] 纯评分与批注引擎 ====================
function budgetPoints(bill,lo,hi){
  if(bill>hi)return 100-(9+(bill-hi)/hi*170);
  if(bill<lo)return 100-Math.min(42,(lo-bill)/lo*55);
  return 100;
}
function judge(scenario, order) {
  const {headcount:h,budgetMin:lo,budgetMax:hi,region,tier,guestTraits:t}=scenario;
  const n=order.length;
  const labels=['预算把控','面子排场','食客体感','识菜避坑','上菜节奏'];
  const clamp=v=>Math.max(0,Math.min(100,Math.round(v)));
  if(h>=4&&n===1){
    const {dish,qty}=order[0],bill=dish.price*qty;
    let verdict;
    if(dish.ingredientType==='staple'){
      verdict='一桌人就点一盘主食，怎么，今天包厢里搞饥荒演习、一人分三粒米？建议直接去楼下沙县一人一碗拌面，别占着人家大圆桌吹空调。';
    }else if(dish.ingredientType==='veg'){
      verdict='请客只上一盘青菜，你是打算带领导和客户集体辟谷修仙，还是明天一早已经准备好递辞职信了？';
    }else if(dish.price>=200||dish.tags.includes('showy_empty')){
      verdict='预算全砸这一道上，一桌子人干瞪眼围着一只盘子转圈，客人没吃饱不说，场面尴尬得能抠出三室一厅。';
    }else{
      verdict='满桌人盯着这一盘菜转转盘，筷子都不好意思伸第二次——这哪是请客吃饭，这是大型服从性测试。';
    }
    const coverage=Math.min(1,dish.portion*qty/h)*dish.edibility/100;
    const score=15+Math.round(10*coverage);
    const points=[budgetPoints(bill,lo,hi),dish.prestige/4,coverage*40,dish.edibility/2,0];
    return {
      score,rank:'职场自爆卡车',stampNote:'人事约谈',
      dimensions:labels.map((label,i)=>({label,value:clamp(points[i])})),
      fatal:h+' 人一桌只开一道菜，触发单菜结局，本局最高 25 分。',
      notes:[
        {dish:dish.name,reason:'全桌只有这一道',text:verdict,good:false},
        {dish:dish.name,reason:'后厨核单',text:h+' 位客人，传菜记录上是 '+qty+' 份同一道菜。第一道端上来，末道也就齐了。',good:false},
        {dish:dish.name,reason:'账单复核',text:'每份 '+dish.price+' 元，合计 '+bill+' 元。报账时菜单就这一行，倒是省纸。',good:false}
      ]
    };
  }
  const ds=order.map(r=>r.dish),notes=[];
  const ranks=['编外打杂实习生','局促见习办事员','中规中矩接待科员','精打细算副科长','稳妥得体接待科长','老练圆滑副处长','滴水不漏正处长','定海神针·资深办公室主任'];
  const money=k=>order.reduce((a,r)=>a+r.dish[k]*r.qty,0);
  const bill=money('price'), size=money('portion'), servings=order.reduce((a,r)=>a+r.qty,0);
  const scores=[budgetPoints(bill,lo,hi),96,98,94,95];
  const edible=money('edibility')/Math.max(1,servings);
  const tagged=(d,k)=>d.tags.includes(k), withTag=k=>ds.filter(d=>tagged(d,k));
  const heavy=d=>d.heaviness>=70;
  const seafood=d=>d.category==='海鲜水产'||['fish','shrimp_crab'].includes(d.ingredientType)||tagged(d,'seafood');
  const suitable=d=>!(t.avoidSeafood&&seafood(d))&&!(t.avoidSpicy&&d.spicy>0);
  const names=list=>list.slice(0,2).map(d=>d.name).join('、');
  const first=ds[0], biggest=order.slice().sort((a,b)=>b.dish.price*b.qty-a.dish.price*a.qty)[0];
  const anchor=biggest?biggest.dish.name:'';
  let cap=100,fatal='';
  function limit(v,s){if(v<cap){cap=v;fatal=s+'，本局最高 '+v+' 分。';}}
  function note(priority,dish,reason,text,good=false){notes.push({priority,dish,reason,text,good});}
  function fault(list,axis,cost,priority,why,text){
    if(!list.length)return;
    scores[axis]-=Math.min(3,list.length)*cost;
    note(priority,names(list),why,text);
  }
  if(bill>hi){
    const over=(bill-hi)/hi;
    note(over>=0.2?99:72,anchor,'超出红线'+(bill-hi)+'元','排面撑起来了，报销单谁签？光这一项就花了'+biggest.dish.price*biggest.qty+'元。');
    if(over>=0.4)limit(39,'总额超预算四成，财务退单');
    else if(over>=0.2)limit(64,'总额超预算两成，接待降级');
  }else if(bill<lo){
    note(43,anchor,'低于预算下限'+(lo-bill)+'元','账上还留着钱，先看看桌上有没有少照顾一双筷子。');
  }else note(48,anchor,'账目合规','全桌'+bill+'元，离红线还剩'+(hi-bill)+'元。签字的人不用陪你做算术。',true);
  const short=Math.max(0,h+1-n), extra=Math.max(0,n-h-2);
  scores[1]-=short*5; scores[2]-=short*6+extra*4+Math.max(0,h-size)*5;
  if(short)note(79,anchor,'菜数不足',h+'位客人只开'+n+'道。再加份也算同一道，转盘上不会多出花样。');
  else if(extra)note(59,anchor,'菜数过多',n+'道菜，比这桌合宜的上限多'+extra+'道。你给打包盒也留座了？');
  else note(44,anchor,'菜数合宜',h+'位客人开'+n+'道，这张单子有分寸。',true);
  if(n<h*0.55||size<h*0.5)limit(39,'菜量严重不足，整桌接待失格');
  if(size>h*2.6){scores[2]-=Math.min(40,(size/h-2.6)*17);note(73,anchor,'份量压桌','菜名数过了，份数也得数。别把明天的午餐也点了。');}

  const show=withTag('showy_empty'), top=ds.slice().sort((a,b)=>b.prestige-a.prestige)[0];
  if(top)scores[1]-=Math.max(0,(t.needsPrestigeface?83:60)-top.prestige)*0.8;
  if(top&&t.needsPrestigeface&&top.prestige<76)note(71,top.name,'缺镇桌菜','拿这道当压轴，客人等了一圈，还以为硬菜堵在传菜口。');
  if(edible<65||show.length>=2){
    scores[2]-=21+Math.max(0,65-edible)*0.6+show.length*3; scores[1]-=12;
    note(90,names(show.length?show:ds),'摆盘多过能吃的肉','转盘跑了一圈，筷子还在找落点。客人散场回家煮泡面，托的是你的福。');
  }else if(top&&top.prestige>=80&&suitable(top)){
    const solid=ds.find(d=>d!==top&&suitable(d)&&d.edibility>=76&&tagged(d,'down_rice'));
    if(solid){scores[1]+=6;scores[2]+=3;note(80,names([top,solid]),'面子里子都顾到','一道撑台面，一道能让人添饭。两笔钱，都花到了筷子底下。',true);}
  }
  if(t.hasElderOrLeader||t.hasFemaleWatchingDiet){
    fault(withTag('needs_peeling'),2,14,85,'剥壳脏手','话说到一半还得低头剥壳，湿巾传得比话筒都勤。');
    fault(withTag('bony_messy'),2,12,81,'吐骨碍谈','客人刚想接话，嘴里还在找骨碟。谈事的节奏给这道菜掐断了。');
  }
  if(tier!=='street'){
    fault(withTag('street_heavy'),1,19,84,'场合错配','食堂、大排档里吃着挺合适，端上正式宴席，接待费愣是花出了工作餐的味道。');
    fault(withTag('premade_suspect'),3,22,88,'半成品嫌疑','酒楼收你现做价，这道却最容易从冻包或泡发盆里来。冤枉钱花得挺利索。');
    const appetizers=withTag('cold_dish').filter(d=>!tagged(d,'showy_empty')&&d.price<150);
    fault(appetizers,3,16,83,'另买餐前凉碟','酒楼已经送了几碟，再买一盘占钱占桌。正式接待还多一项冷食存放的风险。');
  }
  const sea=ds.filter(seafood);
  if(t.avoidSeafood&&sea.length){fault(sea,2,35,103,'忘了海鲜忌口','客人交代过忌口，菜一转到跟前，只好再转给别人。');limit(54,'海鲜忌口未落实');}
  if(t.avoidSpicy)fault(ds.filter(d=>d.spicy>0),2,10,80,'忘了忌辣','客人说过吃不了辣，你递给人家的却是一杯又一杯水。');
  const wants=[
    [t.hasElderOrLeader,withTag('elder_friendly'),'缺道软嫩菜','长辈夹了一圈，没找见一道清淡软嫩、能安心多吃两口的。'],
    [t.hasFemaleWatchingDiet,withTag('low_fat'),'少了清爽选择','有人提了控油，桌上却没给人留一道清爽的。'],
    [t.hasMeatLovers,ds.filter(d=>['beef','pork','poultry'].includes(d.ingredientType)&&d.edibility>=65),'少了实在肉菜','干了一天活来吃肉的客人，找遍菜单也没挑出一盘能大口吃的。']
  ];
  for(const [want,list,why,copy] of wants)if(want&&!list.length){scores[2]-=12;note(67,anchor,why,copy);}
  const regional=withTag('local_signature'), local=regional.filter(d=>d.regions.includes(region)&&suitable(d));
  const wrong=regional.filter(d=>d.regions.length===1&&!d.regions.includes(region));
  const dialect={mindong:'闽东',minnan:'闽南',guangfu:'广府',chuanyu:'川渝',luyu:'鲁豫',shanghai:'沪上'};
  if(local.length){scores[3]+=6;note(74,names(local),'认得本地招牌','这一筷子吃得出地方，客人回去能记住这顿饭。',true);}
  if(wrong.length)fault(wrong,3,13,82,'地方招牌串桌',region==='mindong'&&wrong[0].regions[0]==='minnan'
    ?'在福州请客点泉州闽南菜，地理课没学好还是菜单拿错了？'
    :dialect[region]+'的席偏挑'+dialect[wrong[0].regions[0]]+'的招牌。客人想尝本地味，你让厨子带团出省。');
  const seen=new Map(), clashes=[];
  for(const d of ds){
    if(['veg','soup','staple'].includes(d.ingredientType))continue;
    const key=d.ingredientType+'/'+d.cookMethod;
    if(seen.has(key))clashes.push([seen.get(key),d]);else seen.set(key,d);
  }
  if(clashes.length){scores[3]-=Math.min(4,clashes.length)*11;note(75,names(clashes[0]),'技法撞车','同类食材连做法都没换。菜单写了两行，舌头只记下一道。');}
  const fish=ds.filter(d=>d.ingredientType==='fish'&&suitable(d)), second=fish.find(d=>d.cookMethod!==fish[0].cookMethod);
  if(second){scores[1]+=4;note(78,names([fish[0],second]),'双鱼两吃','两条鱼做出两样滋味，双鱼压阵，没人觉得你重抄了菜单。',true);}
  if(first&&first.ingredientType==='staple'){scores[4]-=38;note(89,first.name,'主食抢头道','一上来就把客人喂饱，后面的硬菜端给谁看？');}
  if(region==='guangfu'){
    const i=ds.findIndex(d=>d.ingredientType==='soup'||d.cookMethod==='soup');
    if(i<0||i>1){scores[4]-=25;note(86,i<0?first?.name||'':ds[i].name,'广府开席缺汤',i<0?'这桌连汤盅都没见着，老广手里的汤匙白拿了。':'汤排在第'+(i+1)+'道。广府这桌，头两道就该让客人把汤喝上。');}
    else{scores[4]+=5;note(68,ds[i].name,'汤上得及时','第'+(i+1)+'道就能舀汤，客人端起碗，这场面算接住了。',true);}
  }
  let pairs=0,firstPair,breakPair;
  for(let i=1;i<n;i++){
    if(!heavy(ds[i-1]))continue;
    if(heavy(ds[i])){pairs++;if(!firstPair)firstPair=ds.slice(i-1,i+1);}
    if(ds[i].ingredientType==='veg'&&ds[i].heaviness<50&&!breakPair)breakPair=ds.slice(i-1,i+1);
  }
  if(pairs){scores[4]-=Math.min(4,pairs)*19;note(87,names(firstPair),'厚菜连击','两道紧挨着上，嘴里全是重汤汁。把清炒时蔬插在中间，客人才有胃口往下吃。');}
  if(breakPair){scores[4]+=5;note(76,names(breakPair),'时蔬解腻','前一道刚吃出厚味，下一筷子就有清爽的接手。这顺序值得后厨照着走。',true);}
  if(n>=3&&!pairs&&first.ingredientType!=='staple')note(40,first.name,'起菜有序','第一道没拿饭面堵嘴，后面也没让两道厚味挤在一起。',true);
  if(n&&edible>=80)note(41,anchor,'复夹率过关','整桌能吃进嘴里的东西够实在，筷子不用跟着摆盘兜圈子。',true);
  if(notes.length<3){
    const methods=new Set(ds.map(d=>d.cookMethod)).size;
    note(30,first?.name||'','全桌技法复核',n?n+'道菜用到'+methods+'种做法。'+(methods>1?'换着口味吃，才能留住下一筷子。':'只写了一种做法，厨师都用不着换手。'):'后厨拿到一张白单，连火都不用开。',methods>1);
  }
  const dimensions=labels.map((label,i)=>({label,value:clamp(scores[i])}));
  const score=Math.min(cap,clamp(dimensions.reduce((a,d)=>a+d.value,0)/5));
  const rank=ranks[[40,55,65,75,83,90,96].filter(edge=>score>=edge).length];
  notes.sort((a,b)=>b.priority-a.priority);
  const chosen=notes.slice(0,6), praise=notes.find(c=>c.good);
  if(praise&&!chosen.includes(praise))chosen[chosen.length-1]=praise;
  return {score,rank,dimensions,fatal,notes:chosen.map(({dish,reason,text,good})=>({dish,reason,text,good}))};
}
// ==================== [MODULE 4: UI_APP] 页面交互与渲染 ====================
const page = document.querySelector("#page"), pad = document.querySelector("#pad"), dialog = document.querySelector("#dialog");
const cats = ["海鲜水产","招牌硬菜","热炒小菜","砂锅炖煲","时令素菜","汤羹主食","凉菜卤味","已点菜单"];
const pick = list => list[Math.floor(Math.random()*list.length)];
const serial = () => String(Math.floor(100000+Math.random()*900000));
let stage="cover", number=serial(), scene, table, order=[], cat=cats[0], report, removing=new Set();
const total = () => order.reduce((sum,x)=>sum+x.qty*x.dish.price,0);
function action(act,label,cls="smallbtn",attrs=""){
  return '<button class="'+cls+'" data-act="'+act+'" '+attrs+'>'+label+'</button>';
}
function ticket(title){return '<div class="ticket"><span>'+title+'</span><b>№ '+number+'</b></div>'}
function meta(){
  return '<div class="meta">'+[["台号",table||"待派"],["人数",scene?scene.headcount+" 位":"待定"],["经手人","玩家"],["单号",number]].map(([k,v])=>'<div>'+k+'<b>'+v+'</b></div>').join("")+'</div>';
}
function imprint(){return '<div class="imprint"><span><i class="inks">▪</i>　白联留底　粉联交厨</span><span>榕港印务</span></div>'}
function heading(step,title,sub=""){return '<div class="stagehead">'+ticket(step)+'<h2 tabindex="-1">'+title+'</h2>'+(sub?'<p>'+sub+'</p>':'')+'</div>'}
function info(label,value){return '<section class="info"><h3>'+label+'</h3><p>'+value+'</p></section>'}
function scenarioInfo(){
  return info("席面",scene.regionLabel+'<br>'+scene.tierLabel)+info("到席客人",scene.guestsSummary)+info("这顿饭的由头",scene.purpose)+info("可用预算",'<b class="pen">¥'+scene.budgetMin+' ～ ¥'+scene.budgetMax+'</b>　总额封顶');
}
function summary(){
  const sum=total(),over=sum>scene.budgetMax;
  return '<div class="summary'+(over?' over':'')+'"><span>已点 <b>'+order.length+'</b> 道</span><span>'+(over?'超预算':'预计')+' <b>¥'+sum+'</b> / '+scene.budgetMax+'</span><span>人均 ¥'+(sum/scene.headcount).toFixed(0)+'</span></div>';
}
function cover(){
  const steps=[["看客接单","看清谁入席、谁做东。"],["联单勾菜","照着预算，勾好这一桌。"],["后厨排单","排妥先后，领接待考评。"]];
  return [ticket("第一联　／　接待存根")+'<section class="poster"><small>福建 · 海鲜排档</small><h1 tabindex="-1">点菜模拟器</h1><img id="fish" width="680" height="232" alt="青墨木刻风的大黄鱼插画"><div class="edition">接 待 点 菜 联 单</div></section>'+meta()+'<section><div class="introhead"><h3>接单须知</h3><span>经手人阅</span></div><ol class="steps">'+steps.map(([a,b],i)=>'<li><i>'+(i+1)+'</i><b>'+a+'</b><span>'+b+'</span></li>').join("")+'</ol></section>',
    action("draw",'<span class="cut" aria-hidden="true">✂</span>撕开今日派单',"primary")+imprint()];
}
function fishPrint(){
  const canvas=document.createElement("canvas");canvas.width=680;canvas.height=232;
  const c=canvas.getContext("2d");
  c.scale(2,2);c.lineCap="round";c.lineJoin="round";

  function line(d,w=1,fill=""){const p=new Path2D(d);if(fill){c.fillStyle=fill;c.fill(p)}c.strokeStyle=ink;c.lineWidth=w;c.stroke(p)}
  c.save();c.translate(9,5);c.rotate(-.045);
  line("M93 44 Q103 28 111 16 L114 25 122 12 125 22 132 10 134 21 144 11 145 21 154 13 156 23 Q178 15 201 35 L208 44 Z",1.5,paper);
  for(let i=0;i<22;i++){let x=105+i*4.3;line('M'+x+' '+(43+Math.sin(i/4)*2)+' q0 -9 '+(5+i/4)+' '+(-18+Math.abs(i-8)*.72),.85)}
  line("M207 56 Q230 48 254 25 Q253 44 248 57 Q255 65 268 75 Q242 78 216 66 Z",1.8,paper);

  line("M150 78 Q161 96 176 97 L173 87 Q193 90 209 70 Z",1.4,paper);

  for(let i=0;i<9;i++)line('M53 '+(45+i*1.7)+' Q93 '+(13+i*1.7)+' 156 '+(23+i*1.1),.72);
  line("M89 55 C118 40 161 42 183 48 Q205 55 222 57",.95);
  c.restore();
  line("M52 48 Q66 36 86 37 Q87 49 95 57 Q94 72 83 77 Q63 73 51 64 L44 62 54 59",1.15,paper);
  line("M84 41 Q88 54 83 64 Q81 70 74 71 M87 56 Q86 72 79 75 M49 61 Q56 63 63 61 M55 66 Q64 68 70 65",1.05);
  for(let i=0;i<7;i++)line('M'+(65+i*2)+' '+(56+i*.5)+' l'+(5-i*.35)+' -2.5',.65);
  c.fillStyle=ink;c.beginPath();c.ellipse(67,48,5.3,4.5,-.2,0,Math.PI*2);c.fill();c.fillStyle=paper;c.beginPath();c.arc(66,47,1.5,0,Math.PI*2);c.fill();
  line("M96 62 Q113 53 135 52 Q122 66 101 70 Z",1.1,paper);
  for(let i=0;i<5;i++)line('M99 '+(63+i)+' Q116 '+(57+i)+' '+(131-i*2)+' '+(54+i*2),.7);
  c.restore();
  for(let i=0;i<3;i++){line('M30 '+(86+i*4)+' q18 3 41 -2 t36 -2',.65);line('M190 '+(93+i*4)+' q15 1 33 -3 t32 -3',.65)}
  c.save();c.translate(281,19);c.rotate(.09);c.strokeStyle="#a24232";c.lineWidth=1.4;c.strokeRect(0,0,19,38);c.fillStyle="#a24232";c.font='bold 14px KaiTi,serif';c.fillText("海",2,16);c.fillText("味",2,32);c.restore();
  document.querySelector("#fish").src=canvas.toDataURL();
}
function menu(){
  const selected=cat===cats[7],list=selected?order.map(x=>x.dish):DISHES.filter(d=>d.category===cat);
  const tabs='<div class="tabs" aria-label="菜品分类">'+cats.map(c=>action("cat",c,"tab"+(cat===c?" active":""),'data-cat="'+c+'" aria-pressed="'+(cat===c)+'"')).join("")+'</div>';
  return [heading("第二联　／　勾菜","联单勾菜")+meta()+tabs+'<div class="sliptop"><b>'+cat+'</b>'+action("brief","看派单")+'</div>'+list.map(d=>{
    const x=order.find(e=>e.dish.id===d.id),id='data-id="'+d.id+'" ',label=(a,t)=>id+'aria-label="'+a+d.name+t+'"';
    return '<article class="dish'+(x?' checked':'')+'"><div class="detail"><div class="name'+(removing.has(d.id)?' cross':'')+'">'+d.name+'</div><div class="desc">'+d.menuDesc+'</div><span class="price">¥'+d.price+'</span><span class="spec">'+d.spec+'</span></div><div class="orderbtns">'+(x?action("minus","−","ctrl",label("减少","一份"))+'<span class="qty">✓'+x.qty+'</span>':'')+action("add","＋","ctrl",label("增加","一份"))+'</div></article>';
  }).join("")+(list.length?'':'<p class="empty">联单还是空的。点上方菜类，挑一道开单。</p>'),summary()+action("kitchen","确认菜单并排上菜顺序","primary",order.length&&!removing.size?"":"disabled")];
}
function kitchen(){
  return [heading("第二联　／　排菜","后厨排单","从上往下出菜，先上的排在前头。")+'<div class="sliptop"><b>'+table+' · '+order.length+' 道</b>'+action("edit","返回勾菜")+'</div>'+order.map(({dish,qty},i)=>{
    const attr='data-id="'+dish.id+'" aria-label="';
    return '<div class="queue"><i class="seq">'+(i+1)+'</i><div class="detail"><span class="name">'+dish.name+'</span><div class="desc">'+qty+' 份　¥'+qty*dish.price+'</div></div>'+action("up","↑","ctrl",attr+'上移'+dish.name+'" '+(i===0?'disabled':''))+action("down","↓","ctrl",attr+'下移'+dish.name+'" '+(i===order.length-1?'disabled':''))+'</div>';
  }).join(""),summary()+action("serve","交后厨出菜","primary")];
}
function grade(){
  // 八档称号都由四字评语和职务组成，印面分两行保留完整职务。
  const remark=report.stampNote?report.rank:report.rank.slice(0,4);
  const role=report.stampNote||report.rank.slice(4).replace(/^·/,"");
  const stampClass=report.stampNote?' special':role.length>5?' long':'';
  const stamp='<div id="grade-rank" class="seal'+stampClass+'" role="img" aria-label="最终职级：'+report.rank+(report.stampNote?'，'+report.stampNote:'')+'">'+
    '<small>职级核定</small><b>'+remark+'</b><strong>'+role+'</strong></div>';
  const header='<header class="stagehead">'+ticket("联单背面　／　经理批阅")+
    '<div class="grade-title"><div><h2 tabindex="-1" aria-describedby="grade-rank">接待考评定级单</h2><p>'+
    scene.title+'</p></div>'+stamp+'</div></header>';
  return [header+meta()+'<div class="report"><div class="sliptop"><b>综合得分</b><span class="score">'+report.score+'<small> / 100</small></span></div>'+summary()+'<div class="bars">'+report.dimensions.map(x=>'<div class="bar"><span>'+x.label+'</span><div class="track"><i style="width:'+x.value+'%"></i></div><b>'+x.value+'</b></div>').join("")+'</div></div><div class="subtitle"><h3>经理逐条批注</h3>'+action("bill","查原单")+'</div>'+(report.fatal?'<p class="over">'+report.fatal+'</p>':'')+'<ol class="notes">'+report.notes.map(n=>'<li><strong>'+n.dish+'</strong>　<u>'+n.reason+'</u>。'+n.text+'</li>').join("")+'</ol>',action("draw","再抽一单","primary")+imprint()];
}
function render(fresh=false){
  const scroll=page.querySelector(".body")?.scrollTop||0,focus=document.activeElement;
  const current=focus?.dataset;
  const [body,foot]=stage==="cover"?cover():stage==="brief"?[heading("第一联　／　接待派单",scene.title)+meta()+scenarioInfo(),action("edit","接单，开始勾菜","primary")+imprint()]:stage==="menu"?menu():stage==="kitchen"?kitchen():grade();
  pad.classList.toggle("back",stage==="report");
  page.innerHTML='<div class="body '+(stage==="cover"?"cover ":"")+(fresh?(stage==="report"?"turn":"reveal"):"")+'">'+body+'</div><footer class="foot">'+foot+'</footer>';
  if(stage==="cover")fishPrint();
  if(fresh){page.querySelector("h2,h1")?.focus({preventScroll:true})}
  else{page.querySelector(".body").scrollTop=scroll;if(current?.act){const candidates=Array.from(page.querySelectorAll("button"));const match=candidates.find(b=>!b.disabled&&b.dataset.act===current.act&&b.dataset.id===current.id&&b.dataset.cat===current.cat)||candidates.find(b=>!b.disabled&&current.id&&b.dataset.id===current.id);match?.focus({preventScroll:true})}}
}
function modal(title,html){
  document.querySelector("#dialogTitle").textContent=title;document.querySelector("#dialogText").innerHTML=html;dialog.showModal();
}
function draw(){
  scene=pick(SCENARIOS.filter(s=>s!==scene));table=pick(["临窗三台","听潮包厢","榕树下桌","海棠小厅","前埕六台","骑楼二桌"]);number=serial();
  order=[];cat=cats[0];report=null;removing.clear();stage="brief";render(true);
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button[data-act]");if(!b||b.disabled)return;
  const a=b.dataset.act,id=b.dataset.id,idx=order.findIndex(x=>x.dish.id===id);
  if(a==="help")return modal("接单须知",'<p>先读客人构成、预算和饭局由头。席上的细节，都写在客人的话里。</p><p>按菜类翻单，用“＋”“−”勾菜和改份数。“已点菜单”可核对整桌，超预算也能下单。</p><p>进后厨用 ↑ ↓ 调整出菜顺序。交单后翻到背面，查看五项得分和经理批注。</p>');
  if(a==="close")return dialog.close();
  if(a==="draw")return draw();
  if(a==="brief")return modal(scene.title,scenarioInfo());
  if(a==="bill")return modal("原单 · 后厨出菜次序",order.map(({dish,qty},i)=>'<p>'+(i+1)+'．'+dish.name+' × '+qty+'　¥'+dish.price*qty+'</p>').join("")+summary());
  if(a==="edit"){stage="menu";return render(true)}
  if(a==="cat"){cat=b.dataset.cat;render();page.querySelector(".body").scrollTop=0;return}
  if(a==="kitchen"&&order.length&&!removing.size){stage="kitchen";return render(true)}
  if(a==="serve"&&order.length){report=judge(scene,order);stage="report";return render(true)}
  if(removing.has(id))return;
  if(a==="add"){
    if(idx<0)order.push({dish:DISHES.find(d=>d.id===id),qty:1});else order[idx].qty++;
    render();
  }else if(a==="minus"&&idx>=0){
    if(order[idx].qty>1){order[idx].qty--;return render()}
    removing.add(id);render();
    setTimeout(()=>{order=order.filter(x=>x.dish.id!==id);removing.delete(id);render()},matchMedia("(prefers-reduced-motion: reduce)").matches?0:210);
  }else if((a==="up"||a==="down")&&idx>=0){
    const next=idx+(a==="up"?-1:1);if(next<0||next>=order.length)return;
    [order[idx],order[next]]=[order[next],order[idx]];render();
    const row=page.querySelectorAll(".queue")[next];row.classList.add("arrived");row.scrollIntoView({block:"nearest"});
  }
});
render();
</script>
